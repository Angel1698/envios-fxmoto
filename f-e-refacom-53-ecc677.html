<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>REFACOM · 6 facturas · FXMoto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Azeret+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra de pestañas fija arriba; cada vista = encabezado del documento + barra de reparto + lista de tarjetas por producto (una columna en celular, dos en escritorio) */
:root{
  --bg:#F3F5F6; --surface:#FFFFFF; --ink:#18212B; --muted:#5B6773; --line:#D9DFE4;
  --accent:#E61B36; --accent-soft:#FCE3E7; --brand:#111111;
  --now:#1F7A3E; --now-soft:#DDF1E3; --later:#A45A06; --later-soft:#FBEBD3; --stay:#5C4E8A; --stay-soft:#E7E2F5; --next:#6B7480; --next-soft:#E6E9EC;
  --comp:#C2410C; --comp-soft:#FFEDD5; --por:#1D4ED8; --por-soft:#DBEAFE; --sobre:#0F766E; --sobre-soft:#CCFBF1;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161B; --surface:#1A2128; --ink:#E7ECEF; --muted:#9AA6B1; --line:#2C3640; --accent:#FF4D63; --accent-soft:#3A1219; --brand:#000000;
  --now:#5BCB84; --now-soft:#173623; --later:#F0A64A; --later-soft:#3A2A14; --stay:#B3A6EC; --stay-soft:#2A2445; --next:#A9B2BC; --next-soft:#252D35; --comp:#FB923C; --comp-soft:#3B1D0E; --por:#82A8FF; --por-soft:#16213F; --sobre:#3DD6C3; --sobre-soft:#0E2E2B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161B; --surface:#1A2128; --ink:#E7ECEF; --muted:#9AA6B1; --line:#2C3640; --accent:#FF4D63; --accent-soft:#3A1219; --brand:#000000;
  --now:#5BCB84; --now-soft:#173623; --later:#F0A64A; --later-soft:#3A2A14; --stay:#B3A6EC; --stay-soft:#2A2445; --next:#A9B2BC; --next-soft:#252D35; --comp:#FB923C; --comp-soft:#3B1D0E; --por:#82A8FF; --por-soft:#16213F; --sobre:#3DD6C3; --sobre-soft:#0E2E2B; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;padding-block:8px}
nav.tabs a{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.02em;text-decoration:none;color:var(--muted);padding:8px 14px;border-radius:8px;white-space:nowrap}
nav.tabs a[aria-current="page"]{background:var(--ink);color:var(--bg)}
nav.tabs a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.1;text-wrap:balance;margin:0}
h1{font-size:30px;letter-spacing:.01em} h2{font-size:22px} h3{font-size:18px;font-weight:600}
.eyebrow{font-family:var(--display);text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:var(--muted);font-weight:600}
.docHead{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:flex-end;padding-block:20px 12px}
.docHead .meta{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:600}
.mono{font-family:var(--mono);font-size:13px}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line);margin-block:10px 8px}
.bar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-weight:600;font-size:13.5px;border:1px solid transparent;background:var(--surface);color:var(--ink);cursor:pointer;font-family:var(--body)}
.chip .n{font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12.5px}
.chip[aria-pressed="true"]{border-color:var(--ink)}
.c-now{background:var(--now-soft);color:var(--now)} .c-later{background:var(--later-soft);color:var(--later)} .c-stay{background:var(--stay-soft);color:var(--stay)} .c-next{background:var(--next-soft);color:var(--next)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:10px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 54px);background:var(--bg);z-index:4}
.tools input[type=search]{flex:1 1 220px;min-width:0;font:inherit;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.list{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:820px){.list{grid-template-columns:1fr 1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;grid-template-columns:84px 1fr;gap:12px;min-width:0}
.card.done{opacity:.55}
.thumb{width:84px;height:84px;border-radius:8px;background:#fff;border:1px solid var(--line);object-fit:contain}
.ph{width:84px;height:84px;border-radius:8px;border:1px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center}
.card .top{display:flex;gap:8px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.code{font-family:var(--mono);font-weight:500;font-size:15px}
.desc{color:var(--muted);font-size:13.5px;margin-block:2px 8px;min-width:0;overflow-wrap:anywhere}
.qty{font-family:var(--display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.qty small{font-family:var(--body);font-size:12px;font-weight:500;color:var(--muted)}
.rows{display:grid;gap:5px}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;border-radius:7px;padding:6px 9px;font-size:13.5px}
.row .lbl{font-weight:600;white-space:nowrap}
.row .det{color:inherit;opacity:.85;min-width:0;overflow-wrap:anywhere}
.row .pz{font-family:var(--mono);font-weight:500;white-space:nowrap}
.tick{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-top:8px;cursor:pointer}
.tick input{width:18px;height:18px;accent-color:var(--accent)}
.group{margin-block:18px 8px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:14px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-family:var(--display);font-weight:600;letter-spacing:.03em;font-size:14px;color:var(--muted);text-transform:uppercase}
td.n{font-variant-numeric:tabular-nums;text-align:right;font-family:var(--mono);font-size:13px}
.prog{height:8px;border-radius:4px;background:var(--line);overflow:hidden;min-width:90px}
.prog i{display:block;height:100%;background:var(--accent)}
.status{display:inline-block;border-radius:6px;padding:2px 8px;font-weight:600;font-size:12.5px;white-space:nowrap}
.note{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--later);border-radius:8px;padding:12px 14px;margin-block:14px}
.grid2{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:820px){.grid2{grid-template-columns:1fr 1fr}}
.sel{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.sel select{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-size:13.5px;font-weight:600;border:0;background:transparent;color:var(--muted);padding:8px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
button.chip[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.bodtag{display:inline-block;font-size:12.5px;font-weight:600;border-radius:6px;padding:2px 8px;margin-top:4px}
.bg{background:var(--accent-soft);color:var(--accent)} .bm{background:var(--later-soft);color:var(--later)}
.share{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-block:4px 10px}
.btn{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer;text-decoration:none}
a.wa{background:var(--now);border-color:var(--now);color:var(--bg)}
.share .url{color:var(--muted);overflow-wrap:anywhere;min-width:0}
.brandbar{background:var(--brand);border-bottom:4px solid var(--accent)}
.brandbar .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.brandbar img{height:40px;width:auto;background:#fff;border-radius:6px;padding:4px 8px}
.brandbar span{color:#fff;font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:.04em;text-transform:uppercase}
nav.tabs a[aria-current="page"]{background:var(--accent);color:#fff}
.bc{background:var(--next-soft);color:var(--ink);margin-left:4px}
.legend a.chip{text-decoration:none}
.pedtag{display:inline-block;background:var(--accent);color:#fff;border-radius:6px;padding:2px 10px;font-size:.75em;vertical-align:middle;margin-right:6px}
.pedtag.sm{font-size:12px;padding:1px 7px;margin-right:2px}
.dl{font-size:13.5px;line-height:1.5;margin:2px 0}.dl.dok{color:var(--now)}
.dl.dpen{display:inline-block;background:#5B6773;color:#FFFFFF;border-radius:6px;padding:1px 8px}.dl.dpen .mono{color:#E4E9ED}
.dl.dpar{background:var(--later-soft);color:var(--ink);border-radius:6px;padding:1px 8px}.dl.dpar a{color:inherit;font-weight:600}
.envto{}.envto.none{color:var(--muted);font-size:12.5px}
.envlk{display:inline-block;margin-left:4px;padding:0 7px;border-radius:999px;background:var(--now-soft);color:var(--now);font-weight:600;font-size:12.5px;text-decoration:none;border:1px solid color-mix(in srgb,var(--now) 40%,transparent)}
.envlk:hover{text-decoration:underline}
.elay{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,460px);gap:22px;align-items:start}
.eside{position:sticky;top:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;max-height:calc(100vh - 24px);overflow:auto}
.esmeta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:13.5px;margin-bottom:10px}.esmeta b{color:var(--ink)}
.estab{width:100%;min-width:0;font-size:13.5px}.estab td{padding:5px 8px}.estab .bsum td{border-top:1px solid var(--line);padding-top:9px}.estab .fsub td:first-child{padding-left:22px}
.estab .blogo{margin-right:6px}.eside .btn{margin-top:12px;display:inline-block;background:var(--accent);color:#fff;border-color:var(--accent)}
.bxsum{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch;margin:10px 0 4px}.bxsum .mini{flex-basis:100%;margin:2px 0 0}
.bxk{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;min-width:130px}.bxk b{display:block;font-size:22px;font-family:var(--display)}.bxk span{font-size:12.5px;color:var(--muted)}
.bxk.va b{color:var(--now)}.bxk.qd b{color:var(--stay)}.bxk.mx b{color:var(--later)}
.bxl{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.bx{display:flex;gap:10px;border:1px solid var(--line);border-left:6px solid var(--now);border-radius:10px;background:var(--surface);padding:10px}.bx.queda{border-left-color:var(--stay)}.bx.mixta{border-left-color:var(--later)}.bx.done{opacity:.55}
.bxb{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}.bxh{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.bxn{font-family:var(--display);font-weight:700;font-size:19px}
.bxs{display:inline-block;align-self:flex-start;border-radius:6px;padding:2px 8px;font-weight:600;font-size:13px}.bxs.va{background:var(--now-soft);color:var(--now)}.bxs.qd{background:var(--stay-soft);color:var(--stay)}.bxs.mx{background:var(--later-soft);color:var(--later)}
.chip.sel{outline:3px solid var(--accent);outline-offset:1px}
@media (max-width:900px){.elay{grid-template-columns:1fr}.eside{position:static;max-height:none}}
.blogo{width:82px;height:24px;object-fit:contain;border-radius:4px;border:1px solid var(--line);vertical-align:middle;margin-right:8px;display:inline-block;flex:none}
h1 .blogo{width:120px;height:35px;border-radius:6px}
h2 .blogo{width:96px;height:28px}
.foot{color:var(--muted);font-size:13px;margin-top:22px}

/* tipos: compuesto / individual por / individual sobre */
.card.sp{border-width:2px;border-left-width:8px}
.card.tc{border-color:var(--comp)} .card.tp{border-color:var(--por)} .card.ts{border-color:var(--sobre)}
.tband{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline;margin:-12px -12px 0 -12px;padding:7px 12px;border-radius:6px 8px 0 0;color:#fff}
.tband b{font-family:var(--display);font-size:21px;letter-spacing:.05em;line-height:1.1}
.tband span{font-size:13.5px;font-weight:500}
.tband.tc,.ttag.tc,.chip.k-tc{background:var(--comp)} .tband.tp,.ttag.tp,.chip.k-tp{background:var(--por)} .tband.ts,.ttag.ts,.chip.k-ts{background:var(--sobre)}
:root[data-theme="dark"] .group.tg h2,:root[data-theme="dark"] .tband,:root[data-theme="dark"] .ttag,:root[data-theme="dark"] .chip.k-tc,:root[data-theme="dark"] .chip.k-tp,:root[data-theme="dark"] .chip.k-ts{color:#111}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .group.tg h2,:root:not([data-theme="light"]) .tband,:root:not([data-theme="light"]) .ttag,:root:not([data-theme="light"]) .chip.k-tc,:root:not([data-theme="light"]) .chip.k-tp,:root:not([data-theme="light"]) .chip.k-ts{color:#111}}
.chip.k-tc,.chip.k-tp,.chip.k-ts{color:#fff}
.ttag{display:inline-block;border-radius:5px;padding:1px 7px;font-size:12px;font-weight:700;color:#fff;margin-right:6px;white-space:nowrap;vertical-align:1px}
.spblock{border:2px solid var(--comp);border-radius:12px;padding:4px 12px 14px;margin-block:14px 6px;background:var(--surface)}
.sphead{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;padding-top:10px}
.sphead h2{color:var(--comp);font-size:26px;text-transform:uppercase;letter-spacing:.04em}
.sphead span{color:var(--muted)}
.group.tg h2{display:inline-block;color:#fff;border-radius:7px;padding:3px 12px;text-transform:uppercase;letter-spacing:.04em}
.group.tg.tc h2{background:var(--comp)} .group.tg.tp h2{background:var(--por)} .group.tg.ts h2{background:var(--sobre)}
.no{display:inline-block;background:var(--ink);color:var(--bg);border-radius:5px;padding:0 6px;margin-right:7px;font-size:13px}
.dim{opacity:.55}
.mini{font-size:12.5px;color:var(--muted)}
.xnote{margin-top:8px;padding:8px 10px;border-radius:8px;background:color-mix(in srgb,#e8a33d 18%,transparent);border:1px solid color-mix(in srgb,#e8a33d 55%,transparent);font-size:13px;line-height:1.35}
.nohere{color:#c2410c}
.sechead{margin-top:6px;font-size:16px;display:flex;align-items:center;flex-wrap:wrap;gap:4px}
/* buscador */
.tools{position:static}
.sbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 54px);z-index:4;background:var(--bg);padding-block:8px 6px}
.sbar input.q{width:100%;font:inherit;font-size:17px;padding:12px 14px;border-radius:10px;border:2px solid var(--ink);background:var(--surface);color:var(--ink)}
body.iso .sbar{top:env(safe-area-inset-top,0px)}
@media (max-width:640px){
 .card{grid-template-columns:64px 1fr;gap:10px}
 .thumb,.ph{width:64px;height:64px}
 .row{grid-template-columns:1fr auto}
 .row .det{grid-column:1/-1;grid-row:2}
 .row .blogo{width:58px;height:18px}
 .tband b{font-size:19px}
}
/* etiquetas */
.labs,.secs{background:var(--surface);border:2px solid var(--ink);border-radius:10px;margin-block:10px}
.labs summary,.secs summary{cursor:pointer;padding:12px 14px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;list-style:none}
.labs summary::-webkit-details-marker,.secs summary::-webkit-details-marker{display:none}
.labs summary::before,.secs summary::before{content:"▸";font-size:16px}
.labs[open] summary::before,.secs[open] summary::before{content:"▾"}
.ltitle{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:.02em}
.secs .tbl{margin:0 12px}.secs p{margin:8px 14px 12px}
.lbody{padding:0 14px 14px;display:grid;gap:10px}
.lrow{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.lrow input.lk{width:80px;font:inherit;padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.lots{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.lot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 10px;padding:8px 10px;border-bottom:1px solid var(--line)}
.lot:last-child{border-bottom:0}
.lbtn{display:flex;flex-wrap:wrap;gap:6px}
.lbtn .btn{padding:6px 10px;font-size:13.5px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.lprev{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.lp svg,.pl svg{display:block;width:100%;height:auto}
.lp svg{border:1px solid #9AA3AC;border-radius:4px}
svg text{dominant-baseline:hanging}
#printArea{display:none}
.zbtn{position:relative;display:block;padding:0;border:0;background:none;cursor:zoom-in;width:max-content;height:max-content;border-radius:8px}
.zic{position:absolute;right:3px;bottom:3px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;line-height:1;border-radius:4px;padding:3px 4px}
#zoom{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:56px 12px 16px;gap:10px;cursor:zoom-out}
#zoom[hidden]{display:none}
#zoom img{max-width:min(100%,1200px);max-height:calc(100vh - 120px);object-fit:contain;background:#fff;border-radius:8px;cursor:default}
#zoom .zcap{color:#fff;font-size:14px;text-align:center;max-width:900px}
#zoom .zclose{position:absolute;top:10px;right:12px;font:inherit;font-weight:600;font-size:15px;background:#fff;color:#111;border:0;border-radius:8px;padding:9px 14px;cursor:pointer}
body.zopen{overflow:hidden}
@media print{
 body.plab>*:not(#printArea){display:none!important}
 body.plab{background:#fff;margin:0}
 body.plab #printArea{display:block!important}
 #printArea .pl{width:50.8mm;height:25.4mm;overflow:hidden;break-after:page;page-break-after:always}
 #printArea .pl:last-child{break-after:auto;page-break-after:auto}
 #printArea .pl svg{width:50.8mm;height:25.4mm}
}

/* avance, observaciones, ayuda */
.prog2{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-block:4px 10px}
.ptxt{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:baseline;color:var(--muted)}
.ptxt b{color:var(--ink);font-weight:600}.ptxt .dp{margin-left:auto;font-family:var(--display);font-size:24px;color:var(--ink)}
.pbar{height:14px;border-radius:7px;background:var(--line);overflow:hidden;margin-top:6px}
.pbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}.pbar i.ok{background:var(--now)}
.note.warn{border-left-color:var(--accent)}
.cfoot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px;margin-top:6px}
.cfoot .tick{margin-top:0}
.btn.obtn{padding:5px 10px;font-size:13px}
.obsv{margin-top:6px;border-radius:7px;padding:6px 9px;font-size:13.5px;background:var(--accent-soft);color:var(--accent)}
.obsp{background:var(--surface);border:2px solid var(--line);border-radius:10px;margin-block:10px}
.obsp.has{border-color:var(--accent)}
.obsp summary{cursor:pointer;padding:12px 14px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;list-style:none}
.obsp summary::-webkit-details-marker{display:none}.obsp summary::before{content:"▸";font-size:16px}.obsp[open] summary::before{content:"▾"}

/* ===== Tema Motofix (mismo diseño que motofix.com.mx): Outfit, rojo FX en degradado, tarjetas redondeadas, día y noche ===== */
:root{
  --bg:#F6F6F7; --surface:#FFFFFF; --surface2:#F5F5F6; --ink:#141416; --ink2:#4A4A52; --muted:#6B6B74; --line:#E7E7EB;

  --por:#1D4FB8; --por-soft:#E4ECFF;
  --display:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif; --body:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"Azeret Mono",ui-monospace,Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(20,20,22,.04),0 8px 24px rgba(20,20,22,.06); --glow:radial-gradient(1000px 520px at 100% 0%,rgba(214,32,42,.08),transparent 65%);
}

  --accent:#FF3B3B; --accent-soft:rgba(255,59,59,.14); --brand:#120709;
  --now:#4ADE80; --now-soft:rgba(34,197,94,.14); --later:#F5B301; --later-soft:rgba(245,179,1,.14); --stay:#C4A7F5; --stay-soft:rgba(167,139,250,.14); --next:#D9C5C7; --next-soft:rgba(255,255,255,.08);
  --por:#7EA6FF; --por-soft:rgba(59,130,246,.14);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); --glow:radial-gradient(1000px 520px at 100% 0%,rgba(214,32,42,.18),transparent 65%); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0A0B; --surface:#141416; --surface2:#1B1B1E; --ink:#FFFFFF; --ink2:#D9C5C7; --muted:#BFA9AB; --line:rgba(255,255,255,.12);

.rl-shot b{color:var(--ink);font-size:14px}
.rl-shot.has{border:0;background:#000}.rl-shot.has img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rl-num{display:grid;gap:6px;align-content:center;font-size:13px;font-weight:600;color:var(--muted)}
.rl-numrow{display:flex;align-items:baseline;gap:8px}
.rl-numrow input{width:100%;min-width:0;font:inherit;font-size:44px;font-weight:500;text-align:center;border:1.5px solid var(--line);border-radius:16px;padding:8px;background:var(--surface2);color:var(--ink)}
.rl-numrow input:focus{outline:2px solid var(--accent);border-color:transparent}
.rl-numrow em{font-style:normal;color:var(--muted);white-space:nowrap;font-size:15px}
.rl-capt .rl-err{grid-column:1/-1}
.rl-last{display:grid;gap:8px}
.rl-box{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px}
.rl-box>div{flex:1;min-width:0;display:grid}
.rl-box b small{color:var(--muted);font-weight:400}
.rl-thumb{width:48px;height:48px;border-radius:10px;overflow:hidden;background:var(--surface2);display:grid;place-items:center;flex:none;color:var(--muted)}.rl-thumb img{width:100%;height:100%;object-fit:cover}
.rl-gdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
.rl-st{font-style:normal;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 8px;white-space:nowrap;background:var(--next-soft);color:var(--ink2)}
.rl-st.ok{background:var(--now-soft);color:var(--now)}.rl-st.err{background:var(--accent-soft);color:var(--accent)}
.rl-errs{color:var(--accent);font-size:12.5px}
/* resumen por grupo */
.rl-grp{border-top:5px solid var(--g)}
.rl-ped{display:grid;gap:10px;margin-top:6px}.rl-ped>header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 10px;padding:0 2px}.rl-ped>header h2{font-size:20px;font-weight:600}.rl-ped>header span{color:var(--muted);font-size:14px}.rl-ped>header b{color:var(--accent)}
.rl-gbar{display:grid;gap:8px}
.rl-gchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.rl-gchip{flex:none;font:inherit;font-size:13.5px;font-weight:600;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 12px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-family:var(--mono)}
.rl-gchip i{width:10px;height:10px;border-radius:50%;background:var(--g)}.rl-gchip small{color:var(--muted);font-weight:400}
.rl-gchip.on{border-color:var(--g);box-shadow:0 0 0 2px color-mix(in srgb,var(--g) 30%,transparent)}
.rl-gnew{display:grid;grid-template-columns:1fr 1fr;gap:8px}.rl-gnew .rl-btn{border:1.5px dashed color-mix(in srgb,var(--ink) 30%,transparent);font-size:15px;padding:11px 8px}
.rl-grp header{display:flex;justify-content:space-between;gap:8px;margin-bottom:10px}.rl-grp header span{font-family:var(--mono);font-size:14px}
.rl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:5px}
.rl-grid button{font:inherit;font-family:var(--mono);font-size:13px;height:38px;border-radius:10px;border:1px dashed color-mix(in srgb,var(--ink) 25%,transparent);background:transparent;color:var(--muted);cursor:pointer;padding:0}
.rl-grid button.on{background:var(--g);border:0;color:#fff}
.rl-grid button.dup{background:var(--later-soft);border:2px solid var(--later);color:var(--later);font-weight:700}
.rl-miss{margin:10px 0 0;font-size:14px;color:var(--accent);line-height:1.45}
.rl-okline{margin:8px 0 0;color:var(--now);font-weight:600;font-size:14px;display:inline-flex;gap:4px;align-items:center}
.rl-check{display:flex;gap:10px;align-items:center;font-size:14.5px}.rl-check input{width:22px;height:22px;accent-color:var(--accent)}
.rl-tar header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
/* ventanas */
.rl-dlg{padding:0;gap:12px}.rl-dlg h2{font-size:21px}
.rl-glist{display:grid;gap:8px}
.rl-gopt{font:inherit;text-align:left;border:0;border-left:8px solid var(--g);background:var(--gb);color:var(--ink);border-radius:14px;padding:10px 12px;display:grid;cursor:pointer}
.rl-gopt span{font-size:13px;color:var(--ink2)}.rl-gopt.on{outline:2px solid var(--g)}
:root[data-theme="dark"] .rl-gopt{background:color-mix(in srgb,var(--g) 18%,transparent)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .rl-gopt{background:color-mix(in srgb,var(--g) 18%,transparent)}}
.rl-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}.rl-pair figure{margin:0;display:grid;gap:4px;text-align:center;font-size:13px;color:var(--muted)}.rl-pair img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:14px;background:var(--surface2)}
.rl-col{display:grid;gap:8px}
.rl-vc{display:grid;gap:8px;border-bottom:1px solid var(--line);padding-bottom:12px}.rl-vc img{width:140px;height:140px;object-fit:cover;border-radius:14px}
.rl-row3{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rl-toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:60;transition:.2s;pointer-events:none;white-space:nowrap}
.rl-toast.on{opacity:1;transform:translate(-50%,0)}
</style>

const HELP=`<h2>Cómo usar esta página</h2>
<p>Aquí está lo que tienes que surtir. Cada tarjeta es una publicación de Mercado Libre (envío) o un código del proveedor (factura). El link solo muestra tu envío, tu factura o tu parte de una factura.</p>
<h3>Paso a paso para surtir un envío</h3>
<ol>
<li><b>Empieza por el recuadro “Revisar primero”.</b> Ahí están los compuestos y los individuales por y sobre, que se arman distinto.</li>
<li><b>Busca el código</b> en la barra de arriba: Código ML, código del proveedor, número de caja o número de etiqueta (#12). Solo se quedan en pantalla los que coinciden.</li>
<li><b>Toma exactamente las piezas que dice cada renglón</b>, de la factura y la caja que indica. No tomes la caja completa.</li>
<li><b>Pega una etiqueta por cada unidad.</b> El número grande de la etiqueta es el mismo # de la tarjeta.</li>
<li><b>Marca “Surtido”.</b> Arriba ves cuántas publicaciones y unidades llevas y el porcentaje de avance. Con el botón <b>Pendientes</b> ves solo lo que falta.</li>
</ol>
<p class="mini">Las palomitas y las observaciones se guardan en este celular o computadora. Si cambias de equipo no aparecen.</p>
<h3>Los tres tipos especiales</h3>
<div class="htype tc"><b>COMPUESTO</b> (naranja): una unidad se arma con dos o más piezas distintas, por ejemplo un juego de rin delantero y trasero o una caja de velocidades con sus engranes. Junta todas las piezas del juego y pon <b>una sola etiqueta por juego</b>. Si una pieza viene de otra factura, la tarjeta lo indica.</div>
<div class="htype tp"><b>INDIVIDUAL POR</b> (azul): cada unidad lleva varias piezas iguales. “Por 10” quiere decir 10 piezas en cada unidad; si dice 5 unidades, son 50 piezas y 5 etiquetas.</div>
<div class="htype ts"><b>INDIVIDUAL SOBRE</b> (verde): una pieza del proveedor alcanza para varias unidades. “Sobre 2” quiere decir que un par se separa en 2 unidades (por ejemplo, un par de direccionales). Separa y etiqueta cada unidad.</div>
<p><b>Individual</b> (sin color): una pieza es una unidad.</p>
<h3>¿Por qué solo se toman unas piezas de una factura?</h3>
<p>Lo que llega no se va todo a Full. Se manda solo lo que se va a vender en los próximos días; el resto se queda en bodega o se aparta para los siguientes envíos. Por eso cada renglón dice cuántas piezas tomar y la factura marca en morado lo que <b>se queda en bodega</b>.</p>
<h3>¿Por qué un envío usa varias facturas?</h3>
<p>Un envío se arma con lo que llegó de distintos proveedores y días. Cada renglón dice de qué factura y caja sale. Si te pasaron el link de una sola factura, solo ves lo que te toca de ella.</p>
<h3>Observaciones</h3>
<p>Si algo llega dañado, falta o sobra, o el proveedor mandó otro color o modelo, presiona <b>Observación</b> en esa tarjeta, elige el motivo y escribe el detalle. Para algo que no es de un producto (por ejemplo, una caja abierta) usa <b>Agregar observación general</b>. Al terminar, abre <b>Observaciones</b> arriba, escribe tu nombre y presiona <b>Enviar a oficina por WhatsApp</b>.</p>

<h3>Fotos</h3>
<p>Toca la foto para verla en grande y revisar detalles (color, modelo, conector).</p>
<p>Si tienes dudas, anótalo en observaciones o pregúntale a tu encargado.</p>`;

function shrink(file,max=1600,q=.72){return new Promise((ok,ko)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',q))};im.onerror=ko;im.src=fr.result};fr.onerror=ko;fr.readAsDataURL(file)})}
function sigPad(cv){const x=cv.getContext('2d');let on=false,used=false;const fit=()=>{const r=cv.getBoundingClientRect();cv.width=r.width*2;cv.height=r.height*2;x.scale(2,2);x.lineWidth=2.2;x.lineCap='round';x.strokeStyle='#111'};fit();
 const pt=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};
 cv.addEventListener('pointerdown',e=>{on=true;used=true;cv.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(...pt(e))});
 cv.addEventListener('pointermove',e=>{if(!on)return;x.lineTo(...pt(e));x.stroke()});
 const end=()=>on=false;cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
 return {clear(){x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,cv.width,cv.height);fit();used=false},empty:()=>!used,data:()=>cv.toDataURL('image/png')}}

/* cola de subida: guarda en el teléfono (IndexedDB) lo que falta subir, para no perder nada si se cae el internet */
const RLQ=(()=>{let db=null,mem=[],busy=false,subs=[];
 const open=()=>new Promise(ok=>{try{const r=indexedDB.open('fx-llegadas',1);r.onupgradeneeded=()=>r.result.createObjectStore('q',{keyPath:'k'});r.onsuccess=()=>{db=r.result;ok()};r.onerror=()=>ok()}catch(_){ok()}});
 const ready=open();
 const all=async()=>{await ready;if(!db)return mem.slice();return new Promise(ok=>{try{const t=db.transaction('q').objectStore('q').getAll();t.onsuccess=()=>ok(t.result.sort((a,b)=>a.t-b.t));t.onerror=()=>ok([])}catch(_){ok([])}})};
 const put=async it=>{await ready;if(!db){mem=mem.filter(x=>x.k!==it.k);mem.push(it);return}await new Promise(ok=>{try{const t=db.transaction('q','readwrite');t.objectStore('q').put(it);t.oncomplete=ok;t.onerror=ok}catch(_){mem.push(it);ok()}})};
 const del=async k=>{await ready;mem=mem.filter(x=>x.k!==k);if(!db)return;await new Promise(ok=>{try{const t=db.transaction('q','readwrite');t.objectStore('q').delete(k);t.oncomplete=ok;t.onerror=ok}catch(_){ok()}})};
 const emit=(it,st,res)=>subs.forEach(f=>{try{f(it,st,res)}catch(_){}});
 async function run(){if(busy)return;busy=true;try{for(;;){const L=await all();const it=L.find(x=>!x.err);if(!it)break;emit(it,'sending');
   try{const r=await postSync(it.body);await del(it.k);emit(it,'ok',r)}
   catch(e){if(/Failed to fetch|NetworkError|network|Load failed|timeout/i.test(e.message)){emit(it,'wait');await new Promise(r=>setTimeout(r,6000));continue}
    it.err=e.message;await put(it);emit(it,'error',e.message)}}}finally{busy=false}}
 addEventListener('online',()=>run());
 return {add:async(k,body)=>{await put({k,t:Date.now(),body});run()},all,del,retry:async k=>{const L=await all();const it=L.find(x=>x.k===k);if(it){delete it.err;await put(it);run()}},on:f=>subs.push(f),run}})();

  const peds=[...new Set(C.grupos.map(g=>g.p))];const faltT=grs.reduce((s,x)=>s+x.miss.length,0),dupT=grs.reduce((s,x)=>s+x.dups,0);
  shell(top('Resumen del conteo',`${esc(C.prov)} · ${esc(C.doc||'')}`,0,0,'cap')+
   `<div class="rl-card rl-sum"><div><span>Cajas que dijo el chofer</span><b>${C.cajasChofer!=null?`${C.cajasChofer} <small class="rl-mini">corregido a ${tot}</small>`:tot}</b></div><div><span>Cajas capturadas</span><b>${n}</b></div><div><span>Diferencia</span><b class="${n<tot?'neg':n>tot?'pos':''}">${n===tot?'cuadra':n<tot?`faltan ${tot-n}`:`sobran ${n-tot}`}</b></div><div><span>Pedidos que llegaron</span><b>${peds.length}</b></div><div><span>Almacenes</span><b>${grs.length}</b></div><div><span>Cajas faltantes según etiquetas</span><b class="${faltT?'neg':''}">${faltT}</b></div><div><span>Cajas repetidas</span><b class="${dupT?'pos':''}">${dupT}</b></div></div>
   ${errs.length?`<div class="rl-note warn"><b>${errs.length} caja(s) no se subieron.</b> ${errs.map(x=>`Caja ${x.c} (${esc(x.err||'')})`).join(' · ')}<div class="rl-acts"><button class="rl-btn sm" data-retry>Reintentar</button></div></div>`:''}
   ${peds.map(p=>{const G=grs.filter(x=>x.g.p===p);const cap=G.reduce((s,x)=>s+x.L.length,0),esp=G.reduce((s,x)=>s+x.g.t,0),fal=G.reduce((s,x)=>s+x.miss.length,0);return `<section class="rl-ped"><header><h2>Pedido ${esc(p)}</h2><span>${cap} de ${esp} cajas · ${G.length} ${G.length>1?'almacenes':'almacén'}${fal?` · <b>faltan ${fal}</b>`:''}</span></header>${G.map(({g,i,L,miss,dups})=>{const [fg,bg]=gCol(i);return `<section class="rl-card rl-grp" style="--g:${fg};--gb:${bg}"><header><b>Almacén ${esc(g.a)}</b><span>${L.length} de ${g.t}</span></header>
    <div class="rl-grid">${Array.from({length:g.t},(_,k)=>{const c=k+1;const has=L.filter(x=>x.c===c);return `<button class="${has.length>1?'dup':has.length?'on':''}" data-gi="${i}" data-c="${c}" aria-label="Caja ${c}${has.length?' capturada':' falta'}">${c}</button>`}).join('')}</div>
    ${miss.length?`<p class="rl-miss"><b>Faltan ${miss.length}:</b> ${miss.join(', ')}</p>`:'<p class="rl-okline">Completo</p>'}${dups?`<p class="rl-miss"><b>${dups} repetida(s)</b> · tócalas para revisar</p>`:''}</section>`}).join('')}</section>`}).join('')}
   <p class="rl-mini">Si de un almacén no bajó ninguna caja, aquí no aparece: lo ves en la diferencia contra lo que dijo el chofer.</p>
   <h2 class="rl-h">Lista de empaque</h2><p class="rl-mini">ALESSIA la manda con la mercancía. Toma foto de <b>todas</b> las hojas, completas y legibles.</p>
   <div class="rl-tiles">${lst.map(x=>`<figure class="rl-tile ph">${x.mini?`<img src="${x.mini}" alt="Hoja ${x.n}">`:`<a href="${esc(x.url||'#')}" target="_blank" rel="noopener">Hoja ${x.n}</a>`}<figcaption>${x.n}</figcaption></figure>`).join('')}<label class="rl-tile add">${RL_ICO.doc}<span>Foto de hoja ${lst.length+1}</span><input type="file" accept="image/*" capture="environment" multiple hidden></label></div>
   <label class="rl-check"><input type="checkbox" class="sinl"${C.sinLista?' checked':''}> No vino lista de empaque (se avisa a oficina)</label>
   <label class="rl-card rl-form rl-fl">Observaciones del conteo<textarea class="cobs" rows="2">${esc(C.obs||'')}</textarea></label>
   <div class="rl-card rl-form"><label class="rl-fl">Firma de ${esc(U.nombre)} para cerrar<canvas class="rl-sig" aria-label="Firma"></canvas></label><button class="rl-link sclr" type="button">Borrar firma</button></div><p class="rl-err" role="alert"></p>`,
   `<button class="rl-btn big" data-go="cap">Seguir contando</button><button class="rl-btn pri big cl">Cerrar llegada</button>`);
  window._rlRefresh=null;
  const sig=sigPad(root.querySelector('.rl-sig'));root.querySelector('.sclr').onclick=()=>sig.clear();
  root.querySelector('.sinl').onchange=e=>{C.sinLista=e.target.checked;saveC()};root.querySelector('.cobs').oninput=e=>{C.obs=e.target.value;saveC()};
  const rt=root.querySelector('[data-retry]');if(rt)rt.onclick=async()=>{for(const x of errs)await RLQ.retry(x.k);errs.forEach(x=>x.st='wait');resumen()};
  root.querySelector('.rl-tiles input').onchange=async ev=>{let n0=lst.length;for(const fl of ev.target.files){try{const full=await shrink(fl,1800,.75),mini=await shrink(fl,240,.55);const k=rlId('F');n0++;F.push({k,clase:'lista',n:n0,mini,st:'wait'});await RLQ.add(k,{tipo:'foto',...cred,id:C.id,cliente:k,clase:'lista',n:n0,foto:full})}catch(_){toast('Una foto no se pudo leer')}}resumen()};
  root.querySelectorAll('.rl-grid button').forEach(b=>b.onclick=()=>{const g=C.grupos[+b.dataset.gi],c=+b.dataset.c;const L=B.filter(x=>x.p===g.p&&x.a===g.a&&x.c===c);if(!L.length){toast(`La caja ${c} no se ha capturado`);return}verCajas(L)});
  root.querySelector('.cl').onclick=async ev=>{const b=ev.currentTarget,er=root.querySelector('.rl-err');er.textContent='';
   const pend=(await RLQ.all()).filter(x=>x.body.id===C.id);if(pend.length){er.textContent=`Todavía faltan ${pend.length} foto(s) por subir. Espera a que diga "todo subido" (necesitas internet).`;return}
   if(!B.length){er.textContent='No hay cajas capturadas.';return}
   if(!F.some(x=>x.clase==='lista')&&!C.sinLista){er.textContent='Falta la foto de la lista de empaque (o marca que no vino).';return}
   if(sig.empty()){er.textContent='Falta la firma.';return}
   const faltan=grs.reduce((s,x)=>s+x.miss.length,0);const txt=[C.cajasChofer!=null?`El chofer declaró ${C.cajasChofer} cajas; se corrigió a ${tot}`:'',n!==tot?`Declaradas: ${tot} cajas · capturadas: ${n}`:'',dupT?`${dupT} caja(s) repetida(s)`:'',faltan?grs.filter(x=>x.miss.length).map(x=>`Faltan del pedido ${x.g.p} alm ${x.g.a}: ${x.miss.join(', ')}`).join(' · '):''].filter(Boolean).join(' · ');
   if(!confirm(`¿Cerrar la llegada?${txt?'\n\n'+txt:''}`))return;
   b.disabled=true;b.textContent='Cerrando…';
   try{await postSync({tipo:'cerrar',...cred,id:C.id,firma:sig.data(),obs:[C.obs,txt].filter(Boolean).join(' · '),sinLista:!!C.sinLista,cajas:C.cajasChofer!=null?tot:''});const o={id:C.id,prov:C.prov,doc:C.doc,txt:`<div class="rl-card rl-sum"><div><span>Cajas capturadas</span><b>${n} de ${tot}</b></div><div><span>Pedidos · almacenes</span><b>${peds.length} · ${grs.length}</b></div>${grs.map(x=>`<div><span>Pedido ${esc(x.g.p)} · alm ${esc(x.g.a)}</span><b>${x.L.length} de ${x.g.t}${x.miss.length?` · faltan ${x.miss.length}`:''}${x.dups?` · ${x.dups} repetida(s)`:''}</b></div>`).join('')}</div>`};listo(o)}
   catch(err){er.textContent='No se cerró: '+fail(err);b.disabled=false;b.textContent='Cerrar llegada'}}}
 function verCajas(L){const d=dialog(`<div class="rl rl-dlg"><h2>${L.length>1?'Cajas repetidas':'Caja '+L[0].c}</h2>${L.map(x=>`<div class="rl-vc" data-k="${esc(x.k)}"><img src="${x.mini||''}" alt="">${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener" class="rl-mini">Ver foto completa</a>`:''}
   <form class="rl-form ed"><div class="rl-row3"><label class="rl-fl">Pedido<input name="p" value="${esc(x.p)}"></label><label class="rl-fl">Almacén<input name="a" value="${esc(x.a)}"></label><label class="rl-fl">Caja<input name="c" inputmode="numeric" value="${x.c}"></label><label class="rl-fl">Total<input name="t" inputmode="numeric" value="${x.t}"></label></div>
   <div class="rl-acts"><button class="rl-btn sm pri" type="submit">Corregir</button><button class="rl-btn sm" type="button" data-del>Borrar caja</button></div><p class="rl-err"></p></form></div>`).join('')}<button class="rl-btn" data-x>Cerrar</button></div>`);
  d.querySelector('[data-x]').onclick=()=>{closeDialog();resumen()};
  d.querySelectorAll('.rl-vc').forEach(v=>{const x=B.find(z=>z.k===v.dataset.k);const f=v.querySelector('form'),er=v.querySelector('.rl-err');
   const ready=()=>{if(x.st!=='ok'){er.textContent='Esta caja todavía se está subiendo; espera un momento.';return false}return true};
   f.onsubmit=async ev=>{ev.preventDefault();if(!ready())return;const p=f.p.value.trim().toUpperCase(),a=f.a.value.trim().toUpperCase(),c=parseInt(f.c.value,10),t=parseInt(f.t.value,10);if(!(c>0&&t>0&&c<=t)){er.textContent='Revisa caja y total.';return}
    try{await postSync({tipo:'caja_editar',...cred,id:C.id,cid:x.cid||x.k,pedido:p,alm:a,caja:c,total:t});Object.assign(x,{p,a,c,t});if(!C.grupos.some(g=>g.p===p&&g.a===a)){C.grupos.push({p,a,t});saveC()}toast('Caja corregida');closeDialog();resumen()}catch(err){er.textContent=fail(err)}};
   v.querySelector('[data-del]').onclick=async()=>{if(!ready())return;if(!confirm(`¿Borrar la caja ${x.c}?`))return;try{await postSync({tipo:'caja_borrar',...cred,id:C.id,cid:x.cid||x.k});B=B.filter(z=>z!==x);toast('Caja borrada');closeDialog();resumen()}catch(err){er.textContent=fail(err)}}})}
 /* ---------- tarimas: etiqueta de paquetería y del proveedor de cada tarima ---------- */
 function tarimas(){const n=C.tarimas||0;const has=(cl,i)=>F.filter(x=>x.clase===cl&&x.n===i);const done=Array.from({length:n},(_,k)=>has('tarima_paq',k+1).length&&has('tarima_prov',k+1).length).filter(Boolean).length;
  const tile=(cl,i,t)=>{const L=has(cl,i);const x=L[L.length-1];return `<label class="rl-tile${x?' ph':' add'}">${x?(x.mini?`<img src="${x.mini}" alt="">`:`<span class="rl-okic">${RL_ICO.ok}</span>`):RL_ICO.cam}<span>${t}</span>${x&&x.st!=='ok'?`<em class="rl-st ${x.st}">${x.st==='err'?'error':'subiendo'}</em>`:''}<input type="file" accept="image/*" capture="environment" hidden data-cl="${cl}" data-i="${i}"></label>`};
  const docs=F.filter(x=>x.clase==='documentos');
  shell(top(`${esc(C.prov)} · fotos de tarimas`,`${esc(C.doc||'')} · ${esc(U.nombre)}`,0,0,'home')+
   `<div class="rl-prog"><div><b>${done}</b> de ${n} tarimas con sus dos fotos</div>${subiendo()}<span class="rl-bar"><i style="width:${n?done/n*100:0}%"></i></span></div>
   ${Array.from({length:n},(_,k)=>`<section class="rl-card rl-tar"><header><b>Tarima ${k+1}</b>${has('tarima_paq',k+1).length&&has('tarima_prov',k+1).length?`<span class="rl-okline">${RL_ICO.ok} lista</span>`:''}</header><div class="rl-tiles two">${tile('tarima_paq',k+1,'Etiqueta de la paquetería')}${tile('tarima_prov',k+1,'Etiqueta de '+esc(C.prov))}</div></section>`).join('')}
   ${C.prov==='REFACOM'?`<h2 class="rl-h">Hojas de la caja DOCUMENTOS</h2><p class="rl-mini">Busca en las tarimas la caja que dice <b>DOCUMENTOS</b> y toma foto de cada hoja. Si todavía no la encuentras, puedes cerrar y subirlas después desde el inicio: la llegada queda pendiente hasta que las subas.</p><div class="rl-tiles">${docs.map(x=>`<figure class="rl-tile ph">${x.mini?`<img src="${x.mini}" alt="Hoja ${x.n}">`:''}<figcaption>${x.n}</figcaption></figure>`).join('')}<label class="rl-tile add">${RL_ICO.doc}<span>Foto de hoja ${docs.length+1}</span><input type="file" accept="image/*" capture="environment" multiple hidden data-docs></label></div>`:''}
   <label class="rl-card rl-form rl-fl">Observaciones<textarea class="cobs" rows="2">${esc(C.obs||'')}</textarea></label>
   <div class="rl-card rl-form"><label class="rl-fl">Firma de ${esc(U.nombre)} para cerrar<canvas class="rl-sig" aria-label="Firma"></canvas></label><button class="rl-link sclr" type="button">Borrar firma</button></div><p class="rl-err" role="alert"></p>`,
   `<button class="rl-btn pri big cl">Cerrar llegada</button>`);
  const sig=sigPad(root.querySelector('.rl-sig'));
  window._rlRefresh=()=>{if(!root.querySelector('.rl-tar'))return;if(!sig.empty()){const p=root.querySelector('.rl-prog');p.querySelectorAll('.rl-up').forEach(z=>z.remove());p.querySelector('div').insertAdjacentHTML('afterend',subiendo());return}const y=scrollY;tarimas();scrollTo(0,y)};root.querySelector('.sclr').onclick=()=>sig.clear();root.querySelector('.cobs').oninput=e=>{C.obs=e.target.value;saveC()};
  root.querySelectorAll('input[data-cl]').forEach(i=>i.onchange=async ev=>{const fl=ev.target.files[0];if(!fl)return;try{const full=await shrink(fl,1600,.72),mini=await shrink(fl,240,.55);const k=rlId('F');F.push({k,clase:i.dataset.cl,n:+i.dataset.i,mini,st:'wait'});await RLQ.add(k,{tipo:'foto',...cred,id:C.id,cliente:k,clase:i.dataset.cl,n:+i.dataset.i,foto:full});const y=scrollY;tarimas();scrollTo(0,y)}catch(_){toast('No se pudo leer la foto')}});
  const di=root.querySelector('input[data-docs]');if(di)di.onchange=async ev=>{let n0=docs.length;for(const fl of ev.target.files){try{const full=await shrink(fl,1800,.75),mini=await shrink(fl,240,.55);const k=rlId('F');n0++;F.push({k,clase:'documentos',n:n0,mini,st:'wait'});await RLQ.add(k,{tipo:'foto',...cred,id:C.id,cliente:k,clase:'documentos',n:n0,foto:full})}catch(_){toast('Una foto no se pudo leer')}}const y=scrollY;tarimas();scrollTo(0,y)};
  root.querySelector('.cl').onclick=async ev=>{const b=ev.currentTarget,er=root.querySelector('.rl-err');er.textContent='';
   for(let i=1;i<=n;i++){if(!has('tarima_paq',i).length){er.textContent=`Falta la etiqueta de paquetería de la tarima ${i}.`;return}if(!has('tarima_prov',i).length){er.textContent=`Falta la etiqueta de ${C.prov} de la tarima ${i}.`;return}}
   const pend=(await RLQ.all()).filter(x=>x.body.id===C.id);if(pend.length){er.textContent=`Todavía faltan ${pend.length} foto(s) por subir. Espera a que diga "todo subido".`;return}
   if(sig.empty()){er.textContent='Falta la firma.';return}
   b.disabled=true;b.textContent='Cerrando…';
   try{await postSync({tipo:'cerrar',...cred,id:C.id,firma:sig.data(),obs:C.obs||''});listo({id:C.id,prov:C.prov,doc:C.doc,pend:C.prov==='REFACOM'&&!docs.length})}
   catch(err){er.textContent='No se cerró: '+fail(err);b.disabled=false;b.textContent='Cerrar llegada'}}}
 /* ---------- REFACOM: subir después las hojas de la caja DOCUMENTOS ---------- */
 function docsRefacom(id,prov){closeDialog();let H=[];const draw=()=>{shell(top('Hojas de la caja DOCUMENTOS',`${esc(prov)} · ${esc(U.nombre)}`,0,0,'home')+
   `<div class="rl-note">Busca en las tarimas la caja que dice <b>DOCUMENTOS</b>. Adentro viene un bonche de hojas: toma una foto de <b>cada hoja</b>, completa y legible.</div>
   <div class="rl-tiles">${H.map((x,i)=>`<figure class="rl-tile ph"><img src="${x.mini}" alt="Hoja ${i+1}"><figcaption>${i+1}</figcaption>${x.st!=='ok'?`<em class="rl-st ${x.st}">${x.st==='err'?'error':'subiendo'}</em>`:''}</figure>`).join('')}<label class="rl-tile add">${RL_ICO.doc}<span>Foto de hoja ${H.length+1}</span><input type="file" accept="image/*" capture="environment" multiple hidden></label></div><p class="rl-err" role="alert"></p>`,
   `<button class="rl-btn pri big fin">Listo</button>`);
  root.querySelector('input').onchange=async ev=>{for(const fl of ev.target.files){try{const full=await shrink(fl,1800,.75),mini=await shrink(fl,240,.55);const k=rlId('F');const x={k,mini,st:'wait'};H.push(x);await RLQ.add(k,{tipo:'foto',...cred,id,cliente:k,clase:'documentos',n:H.length,foto:full})}catch(_){toast('Una foto no se pudo leer')}}draw()};
  root.querySelector('.fin').onclick=async()=>{const er=root.querySelector('.rl-err');if(!H.length){er.textContent='Toma al menos la foto de una hoja.';return}const pend=(await RLQ.all()).filter(x=>x.body.id===id);if(pend.length){er.textContent=`Faltan ${pend.length} foto(s) por subir; espera un momento.`;return}toast('Hojas subidas');home()}};
  window._rlRefresh=null;RLQ.on((it,st)=>{const x=H.find(z=>z.k===it.k);if(x){x.st=st==='ok'?'ok':st==='error'?'err':'wait';if(root.querySelector('.fin'))draw()}});draw()}
 /* ---------- autorizar (encargado) ---------- */
 function autorizar(b){const d=dialog(`<div class="rl rl-dlg"><h2>Autorizar llegada</h2><p class="rl-mini">Cuenta los bultos y revisa que coincidan con lo registrado (${esc(b.dataset.b)}). Autoriza: <b>${esc(U.nombre)}</b>.</p><form class="rl-form aform"><label class="rl-fl">Bultos contados<input name="c" type="number" min="0" inputmode="numeric" required value="${esc(b.dataset.b)}"></label><label class="rl-fl">Diferencias (vacío si todo está bien)<textarea name="d" rows="2"></textarea></label><label class="rl-fl">Firma<canvas class="rl-sig"></canvas></label><div class="rl-acts"><button class="rl-btn pri" type="submit">Autorizar</button><button class="rl-btn" type="button" data-x>Cancelar</button></div><p class="rl-err am"></p></form></div>`);
  const s2=sigPad(d.querySelector('.rl-sig'));const f=d.querySelector('form');d.querySelector('[data-x]').onclick=closeDialog;
  f.onsubmit=async ev=>{ev.preventDefault();if(s2.empty()){d.querySelector('.am').textContent='Falta la firma.';return}const dif=f.d.value.trim()||(+f.c.value!==+b.dataset.b?`Se contaron ${f.c.value} bultos; se registraron ${b.dataset.b}`:'');
   d.querySelector('.am').textContent='Enviando…';try{await postSync({tipo:'autorizar',...cred,id:b.dataset.id,dif,contados:f.c.value,firma:s2.data()});closeDialog();home()}catch(err){d.querySelector('.am').textContent='No se guardó: '+fail(err)}}}
 RLQ.run();
 if(C&&canR)captura();else home();
}
/* ---------- compartir (solo oficina) ---------- */
function shareBar(kind,key,title){const url=isoUrl(kind+':'+key);
 return `<div class="share"><button class="btn xls" data-xk="${kind}" data-xkey="${esc(key)}">Exportar a Excel</button>${url?`<span class="mini"><b>Link para almacén</b> (solo ${kind==='e'?'este envío':'esta factura'}):</span><a class="wa btn" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(title+'\n'+url)}">WhatsApp</a><button class="btn cp" data-url="${esc(url)}">Copiar link</button><a class="btn" target="_blank" rel="noopener" href="${esc(url)}">Abrir</a>`:''}</div>`}
document.addEventListener('click',async e=>{const b=e.target.closest('.cp');if(!b)return;const t=b.textContent;try{await navigator.clipboard.writeText(b.dataset.url);b.textContent='Link copiado'}catch(_){b.textContent='No se pudo copiar'}setTimeout(()=>b.textContent=t,2000)});
/* ---------- navegación ---------- */
function route(){
 const main=document.getElementById('main');
 if(!ADMIN){document.body.classList.add('iso');if(ISO.k==='l'){renderLlegadas(ISO.key,main);return}if(ISO.k==='e')renderEnvio(ISO.key,main,ISO.sec||null);else renderFactura(ISO.key,main);addHelpBtn();let seen=false;try{seen=localStorage.getItem('fx-help-v1')==='1'}catch(_){}if(!seen)openHelp();return}
 const h=(location.hash||'#resumen').slice(1);let tab='resumen';
 if(h.startsWith('f-')&&DATA.facturas[h.slice(2)]){renderFactura(h.slice(2),main);tab='facturas'}
 else if(h.startsWith('e-')&&DATA.envios[h.slice(2)]){renderEnvio(h.slice(2),main,null);tab='envios'}
 else if(h==='facturas'){renderFacturas(main);tab='facturas'}
 else if(h==='envios'){renderEnvios(main);tab='envios'}
 else renderResumen(main);
 addHelpBtn();
 document.querySelectorAll('nav.tabs a').forEach(a=>{if(a.dataset.v===tab)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
 window.scrollTo(0,0);
}
if(ADMIN)addEventListener('hashchange',route);route();
</script></body></html>
