 <div class="side">${r.cimg?`<img loading="lazy" referrerpolicy="no-referrer" src="${esc(r.cimg)}" data-big="${esc(big(r.cimg))}" alt="">`:'<div class="noimg">Foto en el link</div>'}<div style="min-width:0"><div class="lbl">Competencia más barata</div><div class="t">${esc(r.ctit)}</div><div class="price">${money(r.cprecio)}</div><div><span class="tag ${r.clog==='Full'?'full':''}">${esc(r.clog)}</span>${r.cvend?`<span class="mini">${Number(r.cvend).toLocaleString('es-MX')}+ vendidos</span>`:''}${r.cseller?` <span class="mini">· ${esc(r.cseller)}</span>`:''}</div><a href="${link(r.cmlm)}" target="_blank" rel="noopener">${esc(r.cmlm)}</a> <span class="mini">· ${r.nrel} parecidos</span></div></div></div>
 <div class="acts"><button class="bsi" data-v="si" aria-pressed="${v==='si'}">Es la misma</button><button class="bno" data-v="no" aria-pressed="${v==='no'}">No es la misma</button></div></article>`}
function list(){const q=$('#q').value.trim().toLowerCase(),p=$('#fp').value,e=$('#fe').value,c=$('#fc').value;
 return R.filter(r=>(!p||r.prov===p)&&(!c||(c==='low')===!!r.low)&&(e===''||(e==='pend'?!S[r.row]:S[r.row]===e))&&(!q||(r.cod+' '+r.tit+' '+r.prov+' '+r.ctit+' '+r.mlm+' '+r.cmlm).toLowerCase().includes(q)))}
function draw(){const L=list();$('#m').innerHTML=L.slice(0,shown).map(card).join('')+(L.length>shown?`<button class="more" id="more">Mostrar más (${L.length-shown} restantes)</button>`:'')+(L.length?'':'<p class="mini">No hay productos con este filtro.</p>');
 const n=R.length,si=R.filter(r=>S[r.row]==='si').length,no=R.filter(r=>S[r.row]==='no').length;
 $('#st').innerHTML=`<span>Total <b>${n}</b></span><span>Revisados <b>${si+no}</b></span><span style="color:var(--ok)">Es la misma <b>${si}</b></span><span style="color:var(--no)">No es la misma <b>${no}</b></span><span>Mostrando <b>${Math.min(shown,L.length)}</b> de ${L.length}</span>`;
 const m=$('#more');if(m)m.onclick=()=>{shown+=60;draw()}}
['q','fp','fe','fc'].forEach(id=>$('#'+id).addEventListener(id==='q'?'input':'change',()=>{shown=60;draw()}));
const U=()=>String(window.FX_SYNC_URL||'').trim();
let pend=[];async function flush(){if(!pend.length)return;const ch=pend.splice(0);try{const r=await fetch(U(),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({dev:'revision',who:$('#who').value||'Angel',ch})});const j=await r.json();if(!j.ok)throw 0;$('#sync').textContent='Guardado'}catch(_){pend=ch.concat(pend);$('#sync').textContent='Sin conexión, se reintenta';setTimeout(flush,8000)}}
$('#m').onclick=e=>{const b=e.target.closest('[data-v]');if(b){const a=b.closest('.pair'),row=a.dataset.r;const v=S[row]===b.dataset.v?null:b.dataset.v;if(v)S[row]=v;else delete S[row];pend.push({k:K,i:String(row),v});$('#sync').textContent='Guardando…';flush();
  a.className='pair '+(v||'');a.querySelectorAll('[data-v]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===v));const n=R.length,si=Object.values(S).filter(x=>x==='si').length,no=Object.values(S).filter(x=>x==='no').length;$('#st').querySelectorAll('b')[1].textContent=si+no;$('#st').querySelectorAll('b')[2].textContent=si;$('#st').querySelectorAll('b')[3].textContent=no;return}
 const im=e.target.closest('img[data-big]');if(im){const z=document.createElement('div');z.className='zoom';z.innerHTML=`<img src="${esc(im.dataset.big||im.src)}" referrerpolicy="no-referrer">`;z.onclick=()=>z.remove();document.body.appendChild(z)}};
(async()=>{try{const r=await fetch(U()+(U().includes('?')?'&':'?')+'since=1&keys='+K);const j=await r.json();(j.ch||[]).forEach(c=>{if(c[3]==null)delete S[c[2]];else S[c[2]]=c[3]});$('#sync').textContent='Marcas al día'}catch(_){$('#sync').textContent='No se pudieron leer las marcas guardadas'}draw()})();
draw();
