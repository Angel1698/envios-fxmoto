(async()=>{try{const r=await fetch(U()+(U().includes('?')?'&':'?')+'since=1&keys='+K+',p57pics');const j=await r.json();const PI={};(j.ch||[]).forEach(c=>{if(c[1]==='p57pics'){if(c[3])PI[c[2]]=c[3];return}if(c[3]==null)delete S[c[2]];else S[c[2]]=c[3]});R.forEach(r=>{if(!r.cimg&&PI[r.cmlm])r.cimg='https://http2.mlstatic.com/D_NQ_NP_'+PI[r.cmlm]+'-V.webp'});$('#sync').textContent='Marcas al día'}catch(_){$('#sync').textContent='No se pudieron leer las marcas guardadas'}draw()})();
