<style>
/* Layout: barra de pestañas fija arriba; cada vista = encabezado del documento + barra de reparto + lista de tarjetas por producto (una columna en celular, dos en escritorio) */
:root{
  --bg:#F3F5F6; --surface:#FFFFFF; --ink:#18212B; --muted:#5B6773; --line:#D9DFE4;
  --accent:#E61B36; --accent-soft:#FCE3E7; --brand:#111111;

  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --now:#5BCB84; --now-soft:#173623; --later:#F0A64A; --later-soft:#3A2A14; --stay:#B3A6EC; --stay-soft:#2A2445; --next:#A9B2BC; --next-soft:#252D35; --comp:#FB923C; --comp-soft:#3B1D0E; --por:#82A8FF; --por-soft:#16213F; --sobre:#3DD6C3; --sobre-soft:#0E2E2B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161B; --surface:#1A2128; --ink:#E7ECEF; --muted:#9AA6B1; --line:#2C3640; --accent:#FF4D63; --accent-soft:#3A1219; --brand:#000000;
  --now:#5BCB84; --now-soft:#173623; --later:#F0A64A; --later-soft:#3A2A14; --stay:#B3A6EC; --stay-soft:#2A2445; --next:#A9B2BC; --next-soft:#252D35; --comp:#FB923C; --comp-soft:#3B1D0E; --por:#82A8FF; --por-soft:#16213F; --sobre:#3DD6C3; --sobre-soft:#0E2E2B; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:0 48px}

h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.1;text-wrap:balance;margin:0}
h1{font-size:30px;letter-spacing:.01em} h2{font-size:22px} h3{font-size:18px;font-weight:600}
.eyebrow{font-family:var(--display);text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:var(--muted);font-weight:600}

.chip .n{font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12.5px}

.c-now{background:var(--now-soft);color:var(--now)} .c-later{background:var(--later-soft);color:var(--later)} .c-stay{background:var(--stay-soft);color:var(--stay)} .c-next{background:var(--next-soft);color:var(--next)}

.list{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:820px){.list{grid-template-columns:1fr 1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;grid-template-columns:84px 1fr;gap:12px;min-width:0}

/* tipos: compuesto / individual por / individual sobre */
.card.sp{border-width:2px;border-left-width:8px}
.card.tc{border-color:var(--comp)} .card.tp{border-color:var(--por)} .card.ts{border-color:var(--sobre)}

.tband.tc,.ttag.tc,.chip.k-tc{background:var(--comp)} .tband.tp,.ttag.tp,.chip.k-tp{background:var(--por)} .tband.ts,.ttag.ts,.chip.k-ts{background:var(--sobre)}
:root[data-theme="dark"] .group.tg h2,:root[data-theme="dark"] .tband,:root[data-theme="dark"] .ttag,:root[data-theme="dark"] .chip.k-tc,:root[data-theme="dark"] .chip.k-tp,:root[data-theme="dark"] .chip.k-ts{color:#111}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .group.tg h2,:root:not([data-theme="light"]) .tband,:root:not([data-theme="light"]) .ttag,:root:not([data-theme="light"]) .chip.k-tc,:root:not([data-theme="light"]) .chip.k-tp,:root:not([data-theme="light"]) .chip.k-ts{color:#111}}
.chip.k-tc,.chip.k-tp,.chip.k-ts{color:#fff}

.sphead{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;padding-top:10px}
.sphead h2{color:var(--comp);font-size:26px;text-transform:uppercase;letter-spacing:.04em}
.sphead span{color:var(--muted)}
.group.tg h2{display:inline-block;color:#fff;border-radius:7px;padding:3px 12px;text-transform:uppercase;letter-spacing:.04em}
.group.tg.tc h2{background:var(--comp)} .group.tg.tp h2{background:var(--por)} .group.tg.ts h2{background:var(--sobre)}
.no{display:inline-block;background:var(--ink);color:var(--bg);border-radius:5px;padding:0 6px;margin-right:7px;font-size:13px}
.dim{opacity:.55}
.mini{font-size:12.5px;color:var(--muted)}
.sechead{margin-top:6px;font-size:16px;display:flex;align-items:center;flex-wrap:wrap;gap:4px}
/* buscador */
.tools{position:static}
.sbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 54px);z-index:4;background:var(--bg);padding-block:8px 6px}

 .card{grid-template-columns:64px 1fr;gap:10px}

 .row .blogo{width:58px;height:18px}
 .tband b{font-size:19px}
}
/* etiquetas */
.labs,.secs{background:var(--surface);border:2px solid var(--ink);border-radius:10px;margin-block:10px}

.labs summary::-webkit-details-marker,.secs summary::-webkit-details-marker{display:none}
.labs summary::before,.secs summary::before{content:"▸";font-size:16px}
.labs[open] summary::before,.secs[open] summary::before{content:"▾"}
.ltitle{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:.02em}
.secs .tbl{margin:0 12px}.secs p{margin:8px 14px 12px}
.lbody{padding:0 14px 14px;display:grid;gap:10px}
.lrow{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}

.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}

.lp svg,.pl svg{display:block;width:100%;height:auto}
.lp svg{border:1px solid #9AA3AC;border-radius:4px}
svg text{dominant-baseline:hanging}

.zbtn{position:relative;display:block;padding:0;border:0;background:none;cursor:zoom-in;width:max-content;height:max-content;border-radius:8px}
.zic{position:absolute;right:3px;bottom:3px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;line-height:1;border-radius:4px;padding:3px 4px}
#zoom{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:56px 12px 16px;gap:10px;cursor:zoom-out}

 body.plab>*:not(#printArea){display:none!important}

}

const HELP=`<h2>Cómo usar esta página</h2>
<p>Aquí está lo que tienes que surtir. Cada tarjeta es una publicación de Mercado Libre (envío) o un código del proveedor (factura). El link solo muestra tu envío, tu factura o tu parte de una factura.</p>
<h3>Paso a paso para surtir un envío</h3>
<ol>
<li><b>Empieza por el recuadro “Revisar primero”.</b> Ahí están los compuestos y los individuales por y sobre, que se arman distinto.</li>
<li><b>Busca el código</b> en la barra de arriba: Código ML, código del proveedor, número de caja o número de etiqueta (#12). Solo se quedan en pantalla los que coinciden.</li>
<li><b>Toma exactamente las piezas que dice cada renglón</b>, de la factura y la caja que indica. No tomes la caja completa.</li>
<li><b>Pega una etiqueta por cada unidad.</b> El número grande de la etiqueta es el mismo # de la tarjeta.</li>
<li><b>Marca “Surtido”.</b> Arriba ves cuántas publicaciones y unidades llevas y el porcentaje de avance. Con el botón <b>Pendientes</b> ves solo lo que falta.</li>
</ol>
<p class="mini">Las palomitas y las observaciones se guardan en este celular o computadora. Si cambias de equipo no aparecen.</p>
<h3>Los tres tipos especiales</h3>
<div class="htype tc"><b>COMPUESTO</b> (naranja): una unidad se arma con dos o más piezas distintas, por ejemplo un juego de rin delantero y trasero o una caja de velocidades con sus engranes. Junta todas las piezas del juego y pon <b>una sola etiqueta por juego</b>. Si una pieza viene de otra factura, la tarjeta lo indica.</div>
<div class="htype tp"><b>INDIVIDUAL POR</b> (azul): cada unidad lleva varias piezas iguales. “Por 10” quiere decir 10 piezas en cada unidad; si dice 5 unidades, son 50 piezas y 5 etiquetas.</div>
<div class="htype ts"><b>INDIVIDUAL SOBRE</b> (verde): una pieza del proveedor alcanza para varias unidades. “Sobre 2” quiere decir que un par se separa en 2 unidades (por ejemplo, un par de direccionales). Separa y etiqueta cada unidad.</div>
<p><b>Individual</b> (sin color): una pieza es una unidad.</p>
<h3>¿Por qué solo se toman unas piezas de una factura?</h3>
<p>Lo que llega no se va todo a Full. Se manda solo lo que se va a vender en los próximos días; el resto se queda en bodega o se aparta para los siguientes envíos. Por eso cada renglón dice cuántas piezas tomar y la factura marca en morado lo que <b>se queda en bodega</b>.</p>
<h3>¿Por qué un envío usa varias facturas?</h3>
<p>Un envío se arma con lo que llegó de distintos proveedores y días. Cada renglón dice de qué factura y caja sale. Si te pasaron el link de una sola factura, solo ves lo que te toca de ella.</p>
<h3>Observaciones</h3>
<p>Si algo llega dañado, falta o sobra, o el proveedor mandó otro color o modelo, presiona <b>Observación</b> en esa tarjeta, elige el motivo y escribe el detalle. Para algo que no es de un producto (por ejemplo, una caja abierta) usa <b>Agregar observación general</b>. Al terminar, abre <b>Observaciones</b> arriba, escribe tu nombre y presiona <b>Enviar a oficina por WhatsApp</b>.</p>
<h3>Etiquetas</h3>
<p>En <b>Imprimir etiquetas</b> elige lotes de 50 o 100. Cada lote empieza con una etiqueta separadora. En la etiqueta: número grande = # de la tarjeta; abajo, la factura (por ejemplo ALE 079); “3 de 15” = número de etiqueta de ese producto; la franja negra dice si es compuesto, por o sobre. Impresora de etiquetas, tamaño 2 x 1 pulgadas, márgenes en cero.</p>
<h3>Fotos</h3>
<p>Toca la foto para verla en grande y revisar detalles (color, modelo, conector).</p>
<p>Si tienes dudas, anótalo en observaciones o pregúntale a tu encargado.</p>`;

/* ---------- listas ---------- */
function pedStatus(){
 const P=DATA.peds;const g={};P.forEach(r=>{const k=r[0]+'|'+r[1]+'|'+r[2];(g[k]=g[k]||[]).push(r)});
 const peds=[...new Set(P.map(r=>r[0]))];
 return peds.map(p=>{const bods=[...new Set(P.filter(r=>r[0]===p).map(r=>r[1]))];
  const docsAll=P.filter(r=>r[0]===p);const ok=docsAll.filter(r=>r[5]).length;
  return `<div class="group"><h2><span class="pedtag">Pedido ${p}</span> ${ok} de ${docsAll.length} documentos llegaron</h2></div>`+bods.map(b=>{
   const keys=Object.keys(g).filter(k=>k.startsWith(p+'|'+b+'|'));
   const rows=keys.map(k=>{const L=g[k];const n=L.length,ll=L.filter(r=>r[5]).length;const exp=L.reduce((s,r)=>s+(r[4]||0),0),got=L.filter(r=>r[5]).reduce((s,r)=>s+(r[4]||0),0);
     const part=L.some(r=>r[7]);const st=ll===n&&!part?['Completo','c-now']:ll>0?['Parcial','c-later']:['Sin llegar','c-stay'];
     const det=L.map(r=>r[5]?`<div class="dl ${r[7]?'no':'ok'}">${r[7]?'◐':'✓'} ${r[6]?`<a href="${link('f',r[6])}">${esc(r[3])}</a>`:esc(r[3])} <span class="mono">· ${fmt(r[4])} pz · llegó ${esc(r[5])}</span></div>`:`<div class="dl no">◻ ${esc(r[3])} <span class="mono">· ${r[4]==null?'—':fmt(r[4])+' pz'} · pendiente</span></div>`).join('');
     return {st,html:`<tr><td style="white-space:nowrap">${blogo(L[0][2])}<b>${esc(L[0][2])}</b></td><td class="n">${ll} / ${n}</td><td class="n">${exp?fmt(got)+' / '+fmt(exp):'—'}</td><td style="min-width:90px"><div class="prog"><i style="width:${exp?got/exp*100:0}%"></i></div></td><td><span class="status ${st[1]}">${st[0]}</span></td><td>${det}</td></tr>`}});
   const order={'Sin llegar':0,'Parcial':1,'Completo':2};rows.sort((a,b)=>order[a.st[0]]-order[b.st[0]]);
   return `<h3 style="margin:12px 0 6px">${b}</h3><div class="tbl"><table style="min-width:760px"><thead><tr><th>Marca</th><th style="text-align:right">Documentos</th><th style="text-align:right">Piezas llegadas</th><th>Avance</th><th>Estado</th><th>Documentos</th></tr></thead><tbody>${rows.map(r=>r.html).join('')}</tbody></table></div>`}).join('')}).join('');
}

 root.innerHTML=`<div class="docHead"><div><div class="eyebrow">Recepción</div><h1>Cómo van llegando los pedidos</h1></div></div>`+pedStatus()+
  `<div class="group" style="margin-top:26px"><h2>Facturas que llegaron (detalle por producto)</h2></div>`+['CUERNAVACA','EDOMEX'].map(b=>`<h3 style="margin:10px 0 6px">${b==='EDOMEX'?'Edo. Méx.':'Cuernavaca'}</h3><div class="legend">${ks.filter(k=>DATA.facturas[k].bod===b).map(k=>{const F=DATA.facturas[k];return `<a class="chip" href="${link('f',k)}"><span class="pedtag sm">Pedido ${esc(F.pedido)}</span> ${blogo(F.title)}${esc(F.title)} · ${esc(F.llego)} <span class="n">${fmt(F.items.reduce((s,i)=>s+i.qty,0))} pz</span></a>`}).join('')}</div>`).join('');
}
function renderEnvios(root){
 const ks=Object.keys(DATA.envios).sort();
 root.innerHTML=`<div class="docHead"><div><div class="eyebrow">Envíos a Full</div><h1>Envíos</h1></div></div>`+['CUERNAVACA','EDOMEX'].map(b=>`<div class="group"><h2>${b==='EDOMEX'?'Edo. Méx.':'Cuernavaca'}</h2></div><div class="legend">${ks.filter(k=>EM[k].bod===b).map(k=>{const nc=DATA.envios[k].lines.filter(l=>l.tp!=='I').length;return `<a class="chip ${PCLS[phase(k)]}" href="${link('e',k)}">Envío ${k} · ${EM[k].dia} · ${EM[k].dest} <span class="n">${fmt(DATA.envios[k].lines.reduce((s,l)=>s+l.u,0))} u</span>${nc?` <span class="ttag tc">${nc} esp.</span>`:''}</a>`}).join('')}</div>`).join('');
}
/* ---------- compartir (solo oficina) ---------- */
function shareBar(kind,key,title){const url=isoUrl(kind+':'+key);
 return `<div class="share"><button class="btn xls" data-xk="${kind}" data-xkey="${esc(key)}">Exportar a Excel</button>${url?`<span class="mini"><b>Link para almacén</b> (solo ${kind==='e'?'este envío':'esta factura'}):</span><a class="wa btn" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(title+'\n'+url)}">WhatsApp</a><button class="btn cp" data-url="${esc(url)}">Copiar link</button><a class="btn" target="_blank" rel="noopener" href="${esc(url)}">Abrir</a>`:''}</div>`}
document.addEventListener('click',async e=>{const b=e.target.closest('.cp');if(!b)return;const t=b.textContent;try{await navigator.clipboard.writeText(b.dataset.url);b.textContent='Link copiado'}catch(_){b.textContent='No se pudo copiar'}setTimeout(()=>b.textContent=t,2000)});
/* ---------- navegación ---------- */
function route(){
 const main=document.getElementById('main');
 if(!ADMIN){document.body.classList.add('iso');if(ISO.k==='e')renderEnvio(ISO.key,main,ISO.sec||null);else renderFactura(ISO.key,main);addHelpBtn();let seen=false;try{seen=localStorage.getItem('fx-help-v1')==='1'}catch(_){}if(!seen)openHelp();return}
 const h=(location.hash||'#resumen').slice(1);let tab='resumen';
 if(h.startsWith('f-')&&DATA.facturas[h.slice(2)]){renderFactura(h.slice(2),main);tab='facturas'}
 else if(h.startsWith('e-')&&DATA.envios[h.slice(2)]){renderEnvio(h.slice(2),main,null);tab='envios'}
 else if(h==='facturas'){renderFacturas(main);tab='facturas'}
 else if(h==='envios'){renderEnvios(main);tab='envios'}
 else renderResumen(main);
 addHelpBtn();
 document.querySelectorAll('nav.tabs a').forEach(a=>{if(a.dataset.v===tab)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
 window.scrollTo(0,0);
}
if(ADMIN)addEventListener('hashchange',route);route();
</script></body></html>
