}

:root[data-theme="dark"]{

.obsp.has{border-color:var(--accent)}
.obsp summary{cursor:pointer;padding:12px 14px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;list-style:none}
.obsp summary::-webkit-details-marker{display:none}.obsp summary::before{content:"▸";font-size:16px}.obsp[open] summary::before{content:"▾"}
.obsp.has .ocount{color:var(--accent);font-weight:600}
.orow{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;border-top:1px solid var(--line);padding-top:8px}
.owho{font:inherit;padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-width:160px}
.dlgwrap{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:12px}
.dlgwrap[hidden]{display:none}
.dlg{background:var(--surface);color:var(--ink);border-radius:12px;padding:18px;width:min(560px,100%);max-height:calc(100vh - 24px);overflow:auto}
.dlg.help{width:min(720px,100%)}
.dlg h3{margin-top:16px}.dlg p,.dlg ol{margin:6px 0}.dlg li{margin-bottom:4px}
.dlg textarea{width:100%;font:inherit;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.htype{border-left:6px solid;border-radius:8px;padding:8px 10px;margin:8px 0;background:var(--bg)}
.htype.tc{border-color:var(--comp)}.htype.tp{border-color:var(--por)}.htype.ts{border-color:var(--sobre)}
.htype b{font-family:var(--display);letter-spacing:.03em}
.helpfab{position:fixed;right:14px;bottom:14px;z-index:30;font:inherit;font-weight:700;font-size:15px;background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:11px 18px;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}
@media print{.helpfab{display:none}} body.zopen .helpfab{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.ggrp{border-top:3px solid var(--line,#ccc);margin-top:22px;padding-top:4px}.group.sub{margin-block:12px 6px}.group.sub h2{font-size:16px;text-transform:none;letter-spacing:0}
.bxch{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0}.lrng input{width:64px}
.lbody{grid-template-columns:minmax(0,1fr)}.lbody>*{min-width:0}.bxch .chip{white-space:nowrap}
.stk{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline;font-size:12.5px;line-height:1.35;padding:4px 2px 6px;border-bottom:1px solid var(--line);margin-bottom:6px}.stk .stt b{font-size:14px}.stk .stsel{color:var(--muted,#5B6773)}.stk .stprog{font-size:11.5px}.stk .stgrp{flex-basis:100%;font-weight:600;color:var(--ink,inherit)}
.pcl{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted);margin:4px 0}.pcl b{color:var(--ink)}.pcl .neg{color:var(--accent);font-weight:700}.pcl .pos{color:var(--later);font-weight:700}
.nvp{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0;background:var(--surface)}.nvp summary{cursor:pointer}
.alrts{margin:14px 0 6px}.alrt{border:1px solid var(--line);border-left:5px solid var(--later);border-radius:10px;padding:10px 12px;margin:8px 0;background:var(--surface);display:grid;gap:6px}.alrt.alta{border-left-color:var(--accent)}.alrt .ax{font-size:14px}.alrt .btn{justify-self:start}.atag{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 6px;border-radius:4px;background:var(--later);color:#fff}.alrt.alta .atag{background:var(--accent)}
</style>

const HELP=`<h2>Cómo usar esta página</h2>
<p>Aquí está lo que tienes que surtir. Cada tarjeta es una publicación de Mercado Libre (envío) o un código del proveedor (factura). El link solo muestra tu envío, tu factura o tu parte de una factura.</p>
<h3>Paso a paso para surtir un envío</h3>
<ol>
<li><b>Empieza por el recuadro “Revisar primero”.</b> Ahí están los compuestos y los individuales por y sobre, que se arman distinto.</li>
<li><b>Busca el código</b> en la barra de arriba: Código ML, código del proveedor, número de caja o número de etiqueta (#12). Solo se quedan en pantalla los que coinciden.</li>
<li><b>Toma exactamente las piezas que dice cada renglón</b>, de la factura y la caja que indica. No tomes la caja completa.</li>
<li><b>Pega una etiqueta por cada unidad.</b> El número grande de la etiqueta es el mismo # de la tarjeta.</li>
<li><b>Marca “Surtido”.</b> Arriba ves cuántas publicaciones y unidades llevas y el porcentaje de avance. Con el botón <b>Pendientes</b> ves solo lo que falta.</li>
</ol>
<p class="mini">Las palomitas y las observaciones se guardan en este celular o computadora. Si cambias de equipo no aparecen.</p>
<h3>Los tres tipos especiales</h3>
<div class="htype tc"><b>COMPUESTO</b> (naranja): una unidad se arma con dos o más piezas distintas, por ejemplo un juego de rin delantero y trasero o una caja de velocidades con sus engranes. Junta todas las piezas del juego y pon <b>una sola etiqueta por juego</b>. Si una pieza viene de otra factura, la tarjeta lo indica.</div>
<div class="htype tp"><b>INDIVIDUAL POR</b> (azul): cada unidad lleva varias piezas iguales. “Por 10” quiere decir 10 piezas en cada unidad; si dice 5 unidades, son 50 piezas y 5 etiquetas.</div>
<div class="htype ts"><b>INDIVIDUAL SOBRE</b> (verde): una pieza del proveedor alcanza para varias unidades. “Sobre 2” quiere decir que un par se separa en 2 unidades (por ejemplo, un par de direccionales). Separa y etiqueta cada unidad.</div>
<p><b>Individual</b> (sin color): una pieza es una unidad.</p>
<h3>¿Por qué solo se toman unas piezas de una factura?</h3>
<p>Lo que llega no se va todo a Full. Se manda solo lo que se va a vender en los próximos días; el resto se queda en bodega o se aparta para los siguientes envíos. Por eso cada renglón dice cuántas piezas tomar y la factura marca en morado lo que <b>se queda en bodega</b>.</p>
<h3>¿Por qué un envío usa varias facturas?</h3>
<p>Un envío se arma con lo que llegó de distintos proveedores y días. Cada renglón dice de qué factura y caja sale. Si te pasaron el link de una sola factura, solo ves lo que te toca de ella.</p>
<h3>Observaciones</h3>
<p>Si algo llega dañado, falta o sobra, o el proveedor mandó otro color o modelo, presiona <b>Observación</b> en esa tarjeta, elige el motivo y escribe el detalle. Para algo que no es de un producto (por ejemplo, una caja abierta) usa <b>Agregar observación general</b>. Al terminar, abre <b>Observaciones</b> arriba, escribe tu nombre y presiona <b>Enviar a oficina por WhatsApp</b>.</p>

<h3>Fotos</h3>
<p>Toca la foto para verla en grande y revisar detalles (color, modelo, conector).</p>
<p>Si tienes dudas, anótalo en observaciones o pregúntale a tu encargado.</p>`;

 if(!U){root.innerHTML=head+`<form class="lform lin" autocomplete="off"><p class="mini">Solo el personal autorizado de ${bn} puede registrar o autorizar llegadas. Entra con el usuario y la clave que te dio oficina.</p><label>Usuario<input name="u" required autocapitalize="words"></label><label>Clave<input name="c" type="password" inputmode="numeric" required></label><div class="lact"><button class="btn pri" type="submit">Entrar</button><span class="mini lm"></span></div></form>`+css;
  const f=root.querySelector('.lin');f.onsubmit=async e=>{e.preventDefault();const m=f.querySelector('.lm');m.textContent='Revisando…';
   try{const r=await postSync({tipo:'login',bod,usuario:f.u.value.trim(),clave:f.c.value.trim()});ses.set({usuario:f.u.value.trim(),clave:f.c.value.trim(),nombre:r.nombre,puede:r.puede});renderLlegadas(bod,root)}catch(err){m.textContent=err.message}};return}
 const canR=U.puede.includes('registrar'),canA=U.puede.includes('autorizar');const cred={usuario:U.usuario,clave:U.clave,bod};
 const fail=err=>{if(/clave|baja|usuarios/i.test(err.message)){ses.set(null);setTimeout(()=>renderLlegadas(bod,root),2500)}return err.message};
 const EX=(DATA.esperadas||[]).filter(r=>r.bod===bod);const PROV=DATA.provs||[];
 root.innerHTML=head+`<div class="lses mini"><span>Sesión: <b>${esc(U.nombre)}</b> · ${canR&&canA?'registra y autoriza':canR?'registra llegadas':'autoriza llegadas'}</span><button type="button" class="btn lout">Salir</button></div>
 <div class="seg lt">${canR?'<button data-v="nueva" aria-pressed="true">Registrar llegada</button>':''}<button data-v="lista" aria-pressed="${canR?'false':'true'}">${canA?'Por autorizar y anteriores':'Llegadas registradas'}</button></div>
 <form class="lform" autocomplete="off" ${canR?'':'hidden'}>
  <label>Proveedor<select name="prov" required><option value="">Elige…</option>${PROV.map(p=>`<option>${esc(p)}</option>`).join('')}<option>Otro</option></select></label>
  <label>¿Qué documento llegó?<select name="doc"><option value="">Elige el proveedor primero</option></select></label>
  <div class="lrow"><label>Pedido FXMoto<input name="pedido" inputmode="numeric" placeholder="53, 54, 55…"></label><label>Cotización<input name="cot" placeholder="Número"></label><label>Factura o remisión<input name="fact" placeholder="Número"></label></div>
  <div class="lrow"><label>Bultos que llegaron<input name="bultos" type="number" min="0" inputmode="numeric" required></label><label>Tipo<select name="tbultos"><option>cajas</option><option>tarimas</option><option>bolsas</option><option>cajas y tarimas</option></select></label><label>Hora real de llegada<input name="hora" type="datetime-local" required></label></div>
  <label>Fotos de los documentos (factura, remisión, guía, lista de empaque)<input name="fotos" type="file" accept="image/*" capture="environment" multiple></label><div class="lthumbs"></div>
  <label>Observaciones (cajas abiertas, golpeadas, mojadas, faltan bultos)<textarea name="obs" rows="2"></textarea></label>
  <label>Firma de ${esc(U.nombre)}<canvas class="sig" aria-label="Firma"></canvas></label><button type="button" class="btn sclr">Borrar firma</button>
  <div class="lact"><button class="btn pri" type="submit">Registrar llegada</button><span class="lmsg mini"></span></div>
 </form>
 <div class="llist" ${canR?'hidden':''}></div>`+css;
 root.querySelector('.lout').onclick=()=>{ses.set(null);renderLlegadas(bod,root)};
 const fm=root.querySelector('.lform'),lst=root.querySelector('.llist'),msg=root.querySelector('.lmsg');
 if(canR){fm.hora.value=nowLocal();
 const sig=sigPad(root.querySelector('.sig'));root.querySelector('.sclr').onclick=()=>sig.clear();
 fm.prov.onchange=()=>{const L=EX.filter(r=>r.prov===fm.prov.value);fm.doc.innerHTML=`<option value="">${L.length?'Elige…':'No hay documentos esperados de este proveedor'}</option>`+L.map((r,i)=>`<option value="${i}">${esc(r.doc)}${r.pz?' · '+fmt(r.pz)+' pz':''}</option>`).join('')+'<option value="otro">Otro / no está en la lista</option>';fm.doc._L=L};
 fm.doc.onchange=()=>{const r=(fm.doc._L||[])[fm.doc.value];if(!r)return;if(r.pedido)fm.pedido.value=r.pedido;if(r.cot)fm.cot.value=r.cot;if(r.fact)fm.fact.value=r.fact};
 let fotos=[];fm.fotos.onchange=async()=>{msg.textContent='Preparando fotos…';try{for(const f of fm.fotos.files)if(fotos.length<8)fotos.push(await shrink(f))}catch(_){msg.textContent='Una foto no se pudo leer'}fm.fotos.value='';root.querySelector('.lthumbs').innerHTML=fotos.map((d,i)=>`<img src="${d}" alt="Foto ${i+1}">`).join('');msg.textContent=fotos.length+' foto(s) lista(s)'};
 fm.onsubmit=async e=>{e.preventDefault();if(!fotos.length){msg.textContent='Falta la foto de los documentos.';return}if(sig.empty()){msg.textContent='Falta la firma.';return}
  const r=(fm.doc._L||[])[fm.doc.value];const b=fm.querySelector('[type=submit]');b.disabled=true;msg.textContent='Enviando…';
  try{await postSync({tipo:'llegada',...cred,prov:fm.prov.value,doc:r?r.doc:(fm.doc.value==='otro'?'Otro':''),pedido:fm.pedido.value,cot:fm.cot.value,fact:fm.fact.value,bultos:fm.bultos.value,tbultos:fm.tbultos.value,hora:fm.hora.value.replace('T',' '),obs:fm.obs.value,fotos,firma:sig.data()});
   fm.reset();fotos=[];root.querySelector('.lthumbs').innerHTML='';sig.clear();fm.hora.value=nowLocal();msg.textContent='Llegada registrada. Falta que el encargado la autorice.'}
  catch(err){msg.textContent='No se guardó: '+fail(err)}b.disabled=false}}
 async function list(){lst.innerHTML='<p class="mini">Cargando…</p>';try{const L=(await getLlegadas(bod)).slice().reverse();
  lst.innerHTML=L.length?L.map(x=>`<article class="lcard"><div class="lh"><b>${blogo(x.prov)}${esc(x.prov)} · ${esc(x.doc||x.fact||x.cot||'')}</b><span class="status ${lstat(x.estado)}">${esc(x.estado)}</span></div><div class="mini">Llegó ${esc(fdt(x.hora))} · ${esc(x.bultos)} ${esc(x.tbultos)} · recibió ${esc(x.recibio)}${x.pedido?' · pedido '+esc(x.pedido):''}</div>${x.obs?`<div class="mini">${esc(x.obs)}</div>`:''}${x.autorizo?`<div class="mini">Autorizó ${esc(x.autorizo)} · ${esc(fdt(x.fautoriza))}${x.dif?' · '+esc(x.dif):''}</div>`:canA?`<button class="btn pri aut" data-id="${esc(x.id)}" data-b="${esc(x.bultos)}">Autorizar llegada</button>`:''}</article>`).join(''):'<p class="mini">No hay llegadas registradas.</p>'}
  catch(e){lst.innerHTML=`<p class="mini">No se pudieron leer las llegadas (${esc(e.message)}).</p>`}}
 lst.onclick=e=>{const b=e.target.closest('.aut');if(!b)return;
  const d=dialog(`<h2>Autorizar llegada</h2><p class="mini">Cuenta los bultos y revisa que coincidan con lo registrado (${esc(b.dataset.b)}). Autoriza: <b>${esc(U.nombre)}</b>.</p><form class="lform aform"><label>Bultos contados<input name="c" type="number" min="0" inputmode="numeric" required value="${esc(b.dataset.b)}"></label><label>Diferencias (vacío si todo está bien)<textarea name="d" rows="2"></textarea></label><label>Firma<canvas class="sig"></canvas></label><div class="lact"><button class="btn pri" type="submit">Autorizar</button><button class="btn" type="button" data-x>Cancelar</button><span class="mini am"></span></div></form>`);
  const s2=sigPad(d.querySelector('.sig'));const f=d.querySelector('form');d.querySelector('[data-x]').onclick=closeDialog;
  f.onsubmit=async ev=>{ev.preventDefault();if(s2.empty()){d.querySelector('.am').textContent='Falta la firma.';return}const dif=f.d.value.trim()||(+f.c.value!==+b.dataset.b?`Se contaron ${f.c.value} bultos; se registraron ${b.dataset.b}`:'');
   d.querySelector('.am').textContent='Enviando…';try{await postSync({tipo:'autorizar',...cred,id:b.dataset.id,dif,contados:f.c.value,firma:s2.data()});closeDialog();list()}catch(err){d.querySelector('.am').textContent='No se guardó: '+fail(err)}}};
 root.querySelector('.lt').onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;root.querySelectorAll('.lt button').forEach(x=>x.setAttribute('aria-pressed',x===b));const n=b.dataset.v==='nueva';fm.hidden=!n;lst.hidden=n;if(!n)list()};
 if(!canR)list();
}
/* ---------- compartir (solo oficina) ---------- */
function shareBar(kind,key,title){const url=isoUrl(kind+':'+key);
 return `<div class="share"><button class="btn xls" data-xk="${kind}" data-xkey="${esc(key)}">Exportar a Excel</button>${url?`<span class="mini"><b>Link para almacén</b> (solo ${kind==='e'?'este envío':'esta factura'}):</span><a class="wa btn" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(title+'\n'+url)}">WhatsApp</a><button class="btn cp" data-url="${esc(url)}">Copiar link</button><a class="btn" target="_blank" rel="noopener" href="${esc(url)}">Abrir</a>`:''}</div>`}
document.addEventListener('click',async e=>{const b=e.target.closest('.cp');if(!b)return;const t=b.textContent;try{await navigator.clipboard.writeText(b.dataset.url);b.textContent='Link copiado'}catch(_){b.textContent='No se pudo copiar'}setTimeout(()=>b.textContent=t,2000)});
/* ---------- navegación ---------- */
function route(){FXS.reset();
 const main=document.getElementById('main');
 if(!ADMIN){document.body.classList.add('iso');if(ISO.k==='l'){renderLlegadas(ISO.key,main);return}if(ISO.k==='e')renderEnvio(ISO.key,main,ISO.sec||null);else renderFactura(ISO.key,main);addHelpBtn();let seen=false;try{seen=localStorage.getItem('fx-help-v1')==='1'}catch(_){}if(!seen)openHelp();return}
 const h=(location.hash||'#resumen').slice(1);let tab='resumen';
 if(h.startsWith('f-')&&DATA.facturas[h.slice(2)]){renderFactura(h.slice(2),main);tab='facturas'}
 else if(h.startsWith('e-')&&DATA.envios[h.slice(2)]){renderEnvio(h.slice(2),main,null);tab='envios'}
 else if(h==='facturas'){renderFacturas(main);tab='facturas'}
 else if(h==='envios'){renderEnvios(main);tab='envios'}
 else renderResumen(main);
 addHelpBtn();
 document.querySelectorAll('nav.tabs a').forEach(a=>{if(a.dataset.v===tab)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
 window.scrollTo(0,0);
}
if(ADMIN)addEventListener('hashchange',route);route();
</script></body></html>
