<style>
/* Layout: barra de pestañas fija arriba; cada vista = encabezado del documento + barra de reparto + lista de tarjetas por producto (una columna en celular, dos en escritorio) */
:root{
  --bg:#F3F5F6; --surface:#FFFFFF; --ink:#18212B; --muted:#5B6773; --line:#D9DFE4;
  --accent:#E61B36; --accent-soft:#FCE3E7; --brand:#111111;
  --now:#1F7A3E; --now-soft:#DDF1E3; --later:#A45A06; --later-soft:#FBEBD3; --stay:#5C4E8A; --stay-soft:#E7E2F5; --next:#6B7480; --next-soft:#E6E9EC;
  --comp:#C2410C; --comp-soft:#FFEDD5; --por:#1D4ED8; --por-soft:#DBEAFE; --sobre:#0F766E; --sobre-soft:#CCFBF1;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161B; --surface:#1A2128; --ink:#E7ECEF; --muted:#9AA6B1; --line:#2C3640; --accent:#FF4D63; --accent-soft:#3A1219; --brand:#000000;
  --now:#5BCB84; --now-soft:#173623; --later:#F0A64A; --later-soft:#3A2A14; --stay:#B3A6EC; --stay-soft:#2A2445; --next:#A9B2BC; --next-soft:#252D35; --comp:#FB923C; --comp-soft:#3B1D0E; --por:#82A8FF; --por-soft:#16213F; --sobre:#3DD6C3; --sobre-soft:#0E2E2B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161B; --surface:#1A2128; --ink:#E7ECEF; --muted:#9AA6B1; --line:#2C3640; --accent:#FF4D63; --accent-soft:#3A1219; --brand:#000000;
  --now:#5BCB84; --now-soft:#173623; --later:#F0A64A; --later-soft:#3A2A14; --stay:#B3A6EC; --stay-soft:#2A2445; --next:#A9B2BC; --next-soft:#252D35; --comp:#FB923C; --comp-soft:#3B1D0E; --por:#82A8FF; --por-soft:#16213F; --sobre:#3DD6C3; --sobre-soft:#0E2E2B; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;padding-block:8px}
nav.tabs a{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.02em;text-decoration:none;color:var(--muted);padding:8px 14px;border-radius:8px;white-space:nowrap}
nav.tabs a[aria-current="page"]{background:var(--ink);color:var(--bg)}
nav.tabs a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.1;text-wrap:balance;margin:0}
h1{font-size:30px;letter-spacing:.01em} h2{font-size:22px} h3{font-size:18px;font-weight:600}
.eyebrow{font-family:var(--display);text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:var(--muted);font-weight:600}
.docHead{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:flex-end;padding-block:20px 12px}
.docHead .meta{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:600}
.mono{font-family:var(--mono);font-size:13px}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line);margin-block:10px 8px}
.bar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-weight:600;font-size:13.5px;border:1px solid transparent;background:var(--surface);color:var(--ink);cursor:pointer;font-family:var(--body)}
.chip .n{font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12.5px}
.chip[aria-pressed="true"]{border-color:var(--ink)}
.c-now{background:var(--now-soft);color:var(--now)} .c-later{background:var(--later-soft);color:var(--later)} .c-stay{background:var(--stay-soft);color:var(--stay)} .c-next{background:var(--next-soft);color:var(--next)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:10px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 54px);background:var(--bg);z-index:4}
.tools input[type=search]{flex:1 1 220px;min-width:0;font:inherit;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.list{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:820px){.list{grid-template-columns:1fr 1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;grid-template-columns:84px 1fr;gap:12px;min-width:0}
.card.done{opacity:.55}
.thumb{width:84px;height:84px;border-radius:8px;background:#fff;border:1px solid var(--line);object-fit:contain}
.ph{width:84px;height:84px;border-radius:8px;border:1px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center}

.code{font-family:var(--mono);font-weight:500;font-size:15px}
.desc{color:var(--muted);font-size:13.5px;margin-block:2px 8px;min-width:0;overflow-wrap:anywhere}
.qty{font-family:var(--display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}

.rows{display:grid;gap:5px}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;border-radius:7px;padding:6px 9px;font-size:13.5px}
.row .lbl{font-weight:600;white-space:nowrap}
.row .det{color:inherit;opacity:.85;min-width:0;overflow-wrap:anywhere}
.row .pz{font-family:var(--mono);font-weight:500;white-space:nowrap}
.tick{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-top:8px;cursor:pointer}
.tick input{width:18px;height:18px;accent-color:var(--accent)}
.group{margin-block:18px 8px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:14px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-family:var(--display);font-weight:600;letter-spacing:.03em;font-size:14px;color:var(--muted);text-transform:uppercase}
td.n{font-variant-numeric:tabular-nums;text-align:right;font-family:var(--mono);font-size:13px}
.prog{height:8px;border-radius:4px;background:var(--line);overflow:hidden;min-width:90px}
.prog i{display:block;height:100%;background:var(--accent)}
.status{display:inline-block;border-radius:6px;padding:2px 8px;font-weight:600;font-size:12.5px;white-space:nowrap}
.note{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--later);border-radius:8px;padding:12px 14px;margin-block:14px}
.grid2{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:820px){.grid2{grid-template-columns:1fr 1fr}}
.sel{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.sel select{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-size:13.5px;font-weight:600;border:0;background:transparent;color:var(--muted);padding:8px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
button.chip[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.bodtag{display:inline-block;font-size:12.5px;font-weight:600;border-radius:6px;padding:2px 8px;margin-top:4px}
.bg{background:var(--accent-soft);color:var(--accent)} .bm{background:var(--later-soft);color:var(--later)}
.share{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-block:4px 10px}
.btn{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer;text-decoration:none}
a.wa{background:var(--now);border-color:var(--now);color:var(--bg)}
.share .url{color:var(--muted);overflow-wrap:anywhere;min-width:0}
.brandbar{background:var(--brand);border-bottom:4px solid var(--accent)}
.brandbar .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}

.brandbar span{color:#fff;font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:.04em;text-transform:uppercase}
nav.tabs a[aria-current="page"]{background:var(--accent);color:#fff}
.bc{background:var(--next-soft);color:var(--ink);margin-left:4px}
.legend a.chip{text-decoration:none}
.pedtag{display:inline-block;background:var(--accent);color:#fff;border-radius:6px;padding:2px 10px;font-size:.75em;vertical-align:middle;margin-right:6px}
.pedtag.sm{font-size:12px;padding:1px 7px;margin-right:2px}
.dl{font-size:13.5px;line-height:1.5;margin:2px 0}.dl.dok{color:var(--now)}
.dl.dpen{display:inline-block;background:#5B6773;color:#FFFFFF;border-radius:6px;padding:1px 8px}.dl.dpen .mono{color:#E4E9ED}
.dl.dpar{background:var(--later-soft);color:var(--ink);border-radius:6px;padding:1px 8px}.dl.dpar a{color:inherit;font-weight:600}
.envto{}.envto.none{color:var(--muted);font-size:12.5px}
.envlk{display:inline-block;margin-left:4px;padding:0 7px;border-radius:999px;background:var(--now-soft);color:var(--now);font-weight:600;font-size:12.5px;text-decoration:none;border:1px solid color-mix(in srgb,var(--now) 40%,transparent)}
.envlk:hover{text-decoration:underline}
.elay{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,460px);gap:22px;align-items:start}
.eside{position:sticky;top:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;max-height:calc(100vh - 24px);overflow:auto}
.esmeta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:13.5px;margin-bottom:10px}.esmeta b{color:var(--ink)}
.estab{width:100%;min-width:0;font-size:13.5px}.estab td{padding:5px 8px}.estab .bsum td{border-top:1px solid var(--line);padding-top:9px}.estab .fsub td:first-child{padding-left:22px}
.estab .blogo{margin-right:6px}.eside .btn{margin-top:12px;display:inline-block;background:var(--accent);color:#fff;border-color:var(--accent)}
.chip.sel{outline:3px solid var(--accent);outline-offset:1px}

.blogo{width:82px;height:24px;object-fit:contain;border-radius:4px;border:1px solid var(--line);vertical-align:middle;margin-right:8px;display:inline-block;flex:none}

h2 .blogo{width:96px;height:28px}
.foot{color:var(--muted);font-size:13px;margin-top:22px}

/* tipos: compuesto / individual por / individual sobre */
.card.sp{border-width:2px;border-left-width:8px}
.card.tc{border-color:var(--comp)} .card.tp{border-color:var(--por)} .card.ts{border-color:var(--sobre)}
.tband{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline;margin:-12px -12px 0 -12px;padding:7px 12px;border-radius:6px 8px 0 0;color:#fff}
.tband b{font-family:var(--display);font-size:21px;letter-spacing:.05em;line-height:1.1}
.tband span{font-size:13.5px;font-weight:500}
.tband.tc,.ttag.tc,.chip.k-tc{background:var(--comp)} .tband.tp,.ttag.tp,.chip.k-tp{background:var(--por)} .tband.ts,.ttag.ts,.chip.k-ts{background:var(--sobre)}
:root[data-theme="dark"] .group.tg h2,:root[data-theme="dark"] .tband,:root[data-theme="dark"] .ttag,:root[data-theme="dark"] .chip.k-tc,:root[data-theme="dark"] .chip.k-tp,:root[data-theme="dark"] .chip.k-ts{color:#111}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .group.tg h2,:root:not([data-theme="light"]) .tband,:root:not([data-theme="light"]) .ttag,:root:not([data-theme="light"]) .chip.k-tc,:root:not([data-theme="light"]) .chip.k-tp,:root:not([data-theme="light"]) .chip.k-ts{color:#111}}
.chip.k-tc,.chip.k-tp,.chip.k-ts{color:#fff}
.ttag{display:inline-block;border-radius:5px;padding:1px 7px;font-size:12px;font-weight:700;color:#fff;margin-right:6px;white-space:nowrap;vertical-align:1px}
.spblock{border:2px solid var(--comp);border-radius:12px;padding:4px 12px 14px;margin-block:14px 6px;background:var(--surface)}
.sphead{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;padding-top:10px}
.sphead h2{color:var(--comp);font-size:26px;text-transform:uppercase;letter-spacing:.04em}
.sphead span{color:var(--muted)}
.group.tg h2{display:inline-block;color:#fff;border-radius:7px;padding:3px 12px;text-transform:uppercase;letter-spacing:.04em}
.group.tg.tc h2{background:var(--comp)} .group.tg.tp h2{background:var(--por)} .group.tg.ts h2{background:var(--sobre)}
.no{display:inline-block;background:var(--ink);color:var(--bg);border-radius:5px;padding:0 6px;margin-right:7px;font-size:13px}
.dim{opacity:.55}
.mini{font-size:12.5px;color:var(--muted)}
.xnote{margin-top:8px;padding:8px 10px;border-radius:8px;background:color-mix(in srgb,#e8a33d 18%,transparent);border:1px solid color-mix(in srgb,#e8a33d 55%,transparent);font-size:13px;line-height:1.35}
.nohere{color:#c2410c}
.sechead{margin-top:6px;font-size:16px;display:flex;align-items:center;flex-wrap:wrap;gap:4px}
/* buscador */
.tools{position:static}
.sbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 54px);z-index:4;background:var(--bg);padding-block:8px 6px}
.sbar input.q{width:100%;font:inherit;font-size:17px;padding:12px 14px;border-radius:10px;border:2px solid var(--ink);background:var(--surface);color:var(--ink)}
body.iso .sbar{top:env(safe-area-inset-top,0px)}
@media (max-width:640px){
 .card{grid-template-columns:64px 1fr;gap:10px}
 .thumb,.ph{width:64px;height:64px}
 .row{grid-template-columns:1fr auto}
 .row .det{grid-column:1/-1;grid-row:2}
 .row .blogo{width:58px;height:18px}
 .tband b{font-size:19px}
}
/* etiquetas */
.labs,.secs{background:var(--surface);border:2px solid var(--ink);border-radius:10px;margin-block:10px}
.labs summary,.secs summary{cursor:pointer;padding:12px 14px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;list-style:none}
.labs summary::-webkit-details-marker,.secs summary::-webkit-details-marker{display:none}
.labs summary::before,.secs summary::before{content:"▸";font-size:16px}
.labs[open] summary::before,.secs[open] summary::before{content:"▾"}
.ltitle{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:.02em}
.secs .tbl{margin:0 12px}.secs p{margin:8px 14px 12px}
.lbody{padding:0 14px 14px;display:grid;gap:10px}
.lrow{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.lrow input.lk{width:80px;font:inherit;padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.lots{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.lot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 10px;padding:8px 10px;border-bottom:1px solid var(--line)}
.lot:last-child{border-bottom:0}
.lbtn{display:flex;flex-wrap:wrap;gap:6px}
.lbtn .btn{padding:6px 10px;font-size:13.5px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.lprev{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.lp svg,.pl svg{display:block;width:100%;height:auto}
.lp svg{border:1px solid #9AA3AC;border-radius:4px}
svg text{dominant-baseline:hanging}
#printArea{display:none}
.zbtn{position:relative;display:block;padding:0;border:0;background:none;cursor:zoom-in;width:max-content;height:max-content;border-radius:8px}
.zic{position:absolute;right:3px;bottom:3px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;line-height:1;border-radius:4px;padding:3px 4px}
#zoom{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:56px 12px 16px;gap:10px;cursor:zoom-out}

@media print{
 body.plab>*:not(#printArea){display:none!important}

}

/* avance, observaciones, ayuda */
.prog2{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-block:4px 10px}
.ptxt{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:baseline;color:var(--muted)}

.pbar{height:14px;border-radius:7px;background:var(--line);overflow:hidden;margin-top:6px}

.btn.obtn{padding:5px 10px;font-size:13px}

.obsp.has .ocount{color:var(--accent);font-weight:600}
.orow{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;border-top:1px solid var(--line);padding-top:8px}
.owho{font:inherit;padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-width:160px}
.dlgwrap{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:12px}

.dlg{background:var(--surface);color:var(--ink);border-radius:12px;padding:18px;width:min(560px,100%);max-height:calc(100vh - 24px);overflow:auto}

.dlg textarea{width:100%;font:inherit;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.htype{border-left:6px solid;border-radius:8px;padding:8px 10px;margin:8px 0;background:var(--bg)}

const HELP=`<h2>Cómo usar esta página</h2>
<p>Aquí está lo que tienes que surtir. Cada tarjeta es una publicación de Mercado Libre (envío) o un código del proveedor (factura). El link solo muestra tu envío, tu factura o tu parte de una factura.</p>
<h3>Paso a paso para surtir un envío</h3>
<ol>
<li><b>Empieza por el recuadro “Revisar primero”.</b> Ahí están los compuestos y los individuales por y sobre, que se arman distinto.</li>
<li><b>Busca el código</b> en la barra de arriba: Código ML, código del proveedor, número de caja o número de etiqueta (#12). Solo se quedan en pantalla los que coinciden.</li>
<li><b>Toma exactamente las piezas que dice cada renglón</b>, de la factura y la caja que indica. No tomes la caja completa.</li>
<li><b>Pega una etiqueta por cada unidad.</b> El número grande de la etiqueta es el mismo # de la tarjeta.</li>
<li><b>Marca “Surtido”.</b> Arriba ves cuántas publicaciones y unidades llevas y el porcentaje de avance. Con el botón <b>Pendientes</b> ves solo lo que falta.</li>
</ol>
<p class="mini">Las palomitas y las observaciones se guardan en este celular o computadora. Si cambias de equipo no aparecen.</p>
<h3>Los tres tipos especiales</h3>
<div class="htype tc"><b>COMPUESTO</b> (naranja): una unidad se arma con dos o más piezas distintas, por ejemplo un juego de rin delantero y trasero o una caja de velocidades con sus engranes. Junta todas las piezas del juego y pon <b>una sola etiqueta por juego</b>. Si una pieza viene de otra factura, la tarjeta lo indica.</div>
<div class="htype tp"><b>INDIVIDUAL POR</b> (azul): cada unidad lleva varias piezas iguales. “Por 10” quiere decir 10 piezas en cada unidad; si dice 5 unidades, son 50 piezas y 5 etiquetas.</div>
<div class="htype ts"><b>INDIVIDUAL SOBRE</b> (verde): una pieza del proveedor alcanza para varias unidades. “Sobre 2” quiere decir que un par se separa en 2 unidades (por ejemplo, un par de direccionales). Separa y etiqueta cada unidad.</div>
<p><b>Individual</b> (sin color): una pieza es una unidad.</p>
<h3>¿Por qué solo se toman unas piezas de una factura?</h3>
<p>Lo que llega no se va todo a Full. Se manda solo lo que se va a vender en los próximos días; el resto se queda en bodega o se aparta para los siguientes envíos. Por eso cada renglón dice cuántas piezas tomar y la factura marca en morado lo que <b>se queda en bodega</b>.</p>
<h3>¿Por qué un envío usa varias facturas?</h3>
<p>Un envío se arma con lo que llegó de distintos proveedores y días. Cada renglón dice de qué factura y caja sale. Si te pasaron el link de una sola factura, solo ves lo que te toca de ella.</p>
<h3>Observaciones</h3>
<p>Si algo llega dañado, falta o sobra, o el proveedor mandó otro color o modelo, presiona <b>Observación</b> en esa tarjeta, elige el motivo y escribe el detalle. Para algo que no es de un producto (por ejemplo, una caja abierta) usa <b>Agregar observación general</b>. Al terminar, abre <b>Observaciones</b> arriba, escribe tu nombre y presiona <b>Enviar a oficina por WhatsApp</b>.</p>

<h3>Fotos</h3>
<p>Toca la foto para verla en grande y revisar detalles (color, modelo, conector).</p>
<p>Si tienes dudas, anótalo en observaciones o pregúntale a tu encargado.</p>`;

   return {k,F,html:`<tr><td style="white-space:nowrap">${esc(F.llego)}</td><td>${edo?'Edo. Méx.':'Cuernavaca'}</td><td><span class="status c-next">Pedido ${esc(F.pedido)}</span></td><td>${blogo(F.title)}<a href="${link('f',k)}">${esc(F.title)}</a>${F.doc||F.bultos?`<div class="mono" style="color:var(--muted)">${esc([F.doc,F.bultos].filter(Boolean).join(' · '))}</div>`:''}</td><td class="n">${fmt(all)}</td><td class="n">${sal?fmt(sal):'—'}</td><td class="n">${sem?fmt(sem):'—'}</td><td class="n">${esp?fmt(esp):'—'}</td><td class="n">${q?fmt(q):'—'}</td><td class="n">${edo?fmt(med+qM):'—'}</td><td class="n">${edo?fmt(gra+qG):'—'}</td><td style="min-width:260px">${chips}</td></tr>`}});
 const DO=d=>{const x=String(d).match(/(\d+)/);return x?+x[1]:0};
 arr.sort((a,b)=>DO(a.F.llego)-DO(b.F.llego));
 root.innerHTML=`<div class="docHead"><div><div class="eyebrow">Envíos a Full · semana 14–17 oct 2026</div><h1>Cómo vamos esta semana</h1></div>

  <h2 style="margin-top:22px">Siguientes envíos (ya apartados)</h2>
  <div class="legend" style="margin-top:8px">${NX.map(n=>`<a class="chip c-later" href="${link('e',n)}">Envío ${n} · ${EM[n].dia} · ${EM[n].dest} <span class="n">${fmt(DATA.envios[n].lines.reduce((s,l)=>s+l.u,0))} u</span></a>`).join('')}</div>

let _EF=null;function envsOf(fk){if(!fk)return '';if(!_EF){_EF={};for(const k of Object.keys(DATA.envios).sort())for(const l of DATA.envios[k].lines)for(const c of l.comps)(_EF[c.fk]=_EF[c.fk]||new Set()).add(k)}
 const es=[...(_EF[fk]||[])];return es.length?` <span class="envto">→ ${es.map(k=>`<a class="envlk" href="${link('e',k)}">Envío ${k}</a>`).join(' ')}</span>`:` <span class="envto none">→ sin envío asignado</span>`}
function pedStatus(){
 const P=DATA.peds;const g={};P.forEach(r=>{const k=r[0]+'|'+r[1]+'|'+r[2];(g[k]=g[k]||[]).push(r)});
 const peds=[...new Set(P.map(r=>r[0]))];
 return peds.map(p=>{const bods=[...new Set(P.filter(r=>r[0]===p).map(r=>r[1]))];
  const docsAll=P.filter(r=>r[0]===p);const ok=docsAll.filter(r=>r[5]).length;
  return `<div class="group"><h2><span class="pedtag">Pedido ${p}</span> ${ok} de ${docsAll.length} documentos llegaron</h2></div>`+bods.map(b=>{
   const keys=Object.keys(g).filter(k=>k.startsWith(p+'|'+b+'|'));
   const rows=keys.map(k=>{const L=g[k];const n=L.length,ll=L.filter(r=>r[5]).length;const exp=L.reduce((s,r)=>s+(r[4]||0),0),got=L.filter(r=>r[5]).reduce((s,r)=>s+(r[4]||0),0);
     const part=L.some(r=>r[7]);const st=ll===n&&!part?['Completo','c-now']:ll>0?['Parcial','c-later']:['Sin llegar','c-stay'];
     const det=L.map(r=>r[5]?`<div class="dl ${r[7]?'dpar':'dok'}">${r[7]?'◐':'✓'} ${r[6]?`<a href="${link('f',r[6])}">${esc(r[3])}</a>`:esc(r[3])} <span class="mono">· ${fmt(r[4])} pz · llegó ${esc(r[5])}</span>${envsOf(r[6])}</div>`:`<div class="dl dpen">◻ ${esc(r[3])} <span class="mono">· ${r[4]==null?'—':fmt(r[4])+' pz'} · pendiente</span></div>`).join('');
     return {st,html:`<tr><td style="white-space:nowrap">${blogo(L[0][2])}<b>${esc(L[0][2])}</b></td><td class="n">${ll} / ${n}</td><td class="n">${exp?fmt(got)+' / '+fmt(exp):'—'}</td><td style="min-width:90px"><div class="prog"><i style="width:${exp?got/exp*100:0}%"></i></div></td><td><span class="status ${st[1]}">${st[0]}</span></td><td>${det}</td></tr>`}});
   const order={'Sin llegar':0,'Parcial':1,'Completo':2};rows.sort((a,b)=>order[a.st[0]]-order[b.st[0]]);
   return `<h3 style="margin:12px 0 6px">${b}</h3><div class="tbl"><table style="min-width:760px"><thead><tr><th>Marca</th><th style="text-align:right">Documentos</th><th style="text-align:right">Piezas llegadas</th><th>Avance</th><th>Estado</th><th>Documentos</th></tr></thead><tbody>${rows.map(r=>r.html).join('')}</tbody></table></div>`}).join('')}).join('');
}
function renderFacturas(root){

 root.innerHTML=`<div class="docHead"><div><div class="eyebrow">Recepción</div><h1>Cómo van llegando los pedidos</h1></div></div>`+pedStatus()+
  `<div class="group" style="margin-top:26px"><h2>Facturas que llegaron (detalle por producto)</h2></div>`+['CUERNAVACA','EDOMEX'].map(b=>`<h3 style="margin:10px 0 6px">${b==='EDOMEX'?'Edo. Méx.':'Cuernavaca'}</h3><div class="legend">${ks.filter(k=>DATA.facturas[k].bod===b).map(k=>{const F=DATA.facturas[k];return `<a class="chip" href="${link('f',k)}"><span class="pedtag sm">Pedido ${esc(F.pedido)}</span> ${blogo(F.title)}${esc(F.title)} · ${esc(F.llego)} <span class="n">${fmt(F.items.reduce((s,i)=>s+i.qty,0))} pz</span></a>`}).join('')}</div>`).join('');
}
function envSummary(k){const E=DATA.envios[k],M=EM[k];const fx={};let tu=0;const tc={C:0,P:0,S:0,I:0};
 for(const l of E.lines){tu+=l.u;tc[l.tp]=(tc[l.tp]||0)+1;const seen=new Set();for(const c of l.comps){const f=fx[c.fk]=fx[c.fk]||{pubs:0,u:0,pz:0,shared:0};f.pz+=c.pz;if(!seen.has(c.fk)){seen.add(c.fk);f.pubs++;f.u+=l.u;if(new Set(l.comps.map(x=>x.fk)).size>1)f.shared++}}}
 const br={};for(const fk in fx){const t=DATA.facturas[fk]?DATA.facturas[fk].title:fk;const b=t.split(' · ')[0];(br[b]=br[b]||{u:0,pz:0,pubs:0,fs:[]}).fs.push(fk);br[b].u+=fx[fk].u;br[b].pz+=fx[fk].pz;br[b].pubs+=fx[fk].pubs}
 const bs=Object.keys(br).sort((a,b)=>br[b].u-br[a].u);const sh=Object.values(fx).some(f=>f.shared);
 const rows=bs.map(b=>`<tr class="bsum"><td>${blogo(b)}<b>${esc(b)}</b></td><td class="n">${br[b].pubs}</td><td class="n">${fmt(br[b].u)}</td><td class="n">${fmt(br[b].pz)}</td></tr>`+br[b].fs.sort((x,y)=>fx[y].u-fx[x].u).map(fk=>{const F=DATA.facturas[fk]||{};const num=(F.title||fk).split(' · ').slice(1).join(' · ');return `<tr class="fsub"><td><a href="${link('f',fk)}">${esc(num||fk)}</a> <span class="mini">· Pedido ${esc(F.pedido||'')}${F.doc?' · '+esc(F.doc):''}</span>${fx[fk].shared?` <span class="mini">· ${fx[fk].shared} comp. compartidos</span>`:''}</td><td class="n">${fx[fk].pubs}</td><td class="n">${fmt(fx[fk].u)}</td><td class="n">${fmt(fx[fk].pz)}</td></tr>`}).join('')).join('');
 const esp=(tc.C||0)+(tc.P||0)+(tc.S||0);
 return `<div class="eyebrow">${M.bod==='EDOMEX'?'Edo. Méx.':'Cuernavaca'}${M.size?' · '+(M.size==='G'?'grandes':'pequeños y medianos'):''}</div><h2 style="margin:2px 0 6px">Envío ${k}</h2>
 <div class="esmeta"><span><b>${esc(M.dia)}</b></span><span>Destino <b>${esc(M.dest)}</b></span><span><b>${fmt(tu)}</b> u${M.meta?` de meta ${fmt(M.meta)}`:''}</span><span><b>${E.lines.length}</b> publicaciones</span>${esp?`<span><b>${esp}</b> especiales (${tc.C||0} comp. · ${tc.P||0} por · ${tc.S||0} sobre)</span>`:''}</div>
 <div class="tbl"><table class="estab"><thead><tr><th>Marca / factura</th><th style="text-align:right">Publ.</th><th style="text-align:right">u. ML</th><th style="text-align:right">Piezas</th></tr></thead><tbody>${rows}</tbody></table></div>
 ${sh?'<p class="mini">Un compuesto con piezas de dos facturas cuenta en las dos.</p>':''}
 <a class="btn primary" href="${link('e',k)}">Abrir envío ${k}</a>`}
function renderEnvios(root){
 const ks=Object.keys(DATA.envios).sort();let sel=ks.find(k=>phase(k)==='now')||ks[0];
 root.innerHTML=`<div class="docHead"><div><div class="eyebrow">Envíos a Full</div><h1>Envíos</h1></div><div class="meta">Toca un envío para ver de qué facturas se compone.</div></div><div class="elay"><div>`+['CUERNAVACA','EDOMEX'].map(b=>`<div class="group"><h2>${b==='EDOMEX'?'Edo. Méx.':'Cuernavaca'}</h2></div><div class="legend">${ks.filter(k=>EM[k].bod===b).map(k=>{const nc=DATA.envios[k].lines.filter(l=>l.tp!=='I').length;return `<a class="chip ${PCLS[phase(k)]}" data-k="${k}" href="${link('e',k)}">Envío ${k} · ${EM[k].dia} · ${EM[k].dest} <span class="n">${fmt(DATA.envios[k].lines.reduce((s,l)=>s+l.u,0))} u</span>${nc?` <span class="ttag tc">${nc} esp.</span>`:''}</a>`}).join('')}</div>`).join('')+`</div><aside class="eside"></aside></div>`;

 const show=k=>{sel=k;side.innerHTML=envSummary(k);root.querySelectorAll('.chip[data-k]').forEach(c=>c.classList.toggle('sel',c.dataset.k===k))};
 root.querySelectorAll('.chip[data-k]').forEach(c=>c.onclick=e=>{if(e.ctrlKey||e.metaKey)return;e.preventDefault();show(c.dataset.k);if(innerWidth<900)side.scrollIntoView({behavior:'smooth',block:'start'})});

function route(){

 if(!ADMIN){document.body.classList.add('iso');if(ISO.k==='e')renderEnvio(ISO.key,main,ISO.sec||null);else renderFactura(ISO.key,main);addHelpBtn();let seen=false;try{seen=localStorage.getItem('fx-help-v1')==='1'}catch(_){}if(!seen)openHelp();return}

 else if(h==='facturas'){renderFacturas(main);tab='facturas'}
 else if(h==='envios'){renderEnvios(main);tab='envios'}
 else renderResumen(main);
 addHelpBtn();
 document.querySelectorAll('nav.tabs a').forEach(a=>{if(a.dataset.v===tab)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
 window.scrollTo(0,0);
}
if(ADMIN)addEventListener('hashchange',route);route();
